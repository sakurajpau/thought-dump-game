<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Claude Code 実務練習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one workbook column. Each mission = a goal card on top, a working "仕事フォルダ" desk below (files, chat with Claude, controls). */
:root {
  --bg: #EEF2F0;
  --surface: #FFFFFF;
  --desk: #F6F8F7;
  --ink: #17201D;
  --muted: #56635E;
  --line: #D3DCD8;
  --accent: #1E6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDE6;
  --spark: #C8701F;
  --spark-ink: #1A1006;
  --spark-soft: #FBEBDB;
  --good: #2C7A4B;
  --good-soft: #E0F1E6;
  --bad: #B0453A;
  --bad-soft: #F8E3E0;
  --plan: #4F5FA8;
  --plan-soft: #E4E7F6;
  --font-display: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #172120; --desk: #121A19; --ink: #E5EEEA; --muted: #9DAEA7; --line: #2B3835;
    --accent: #5FC3A5; --accent-ink: #062019; --accent-soft: #1D3530;
    --spark: #F0A458; --spark-ink: #1A1006; --spark-soft: #3A2A1A; --good: #74CF97; --good-soft: #1B3326;
    --bad: #EE8E82; --bad-soft: #3A2120; --plan: #A3B0F0; --plan-soft: #232A45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #172120; --desk: #121A19; --ink: #E5EEEA; --muted: #9DAEA7; --line: #2B3835;
  --accent: #5FC3A5; --accent-ink: #062019; --accent-soft: #1D3530;
  --spark: #F0A458; --spark-ink: #1A1006; --spark-soft: #3A2A1A; --good: #74CF97; --good-soft: #1B3326;
  --bad: #EE8E82; --bad-soft: #3A2120; --plan: #A3B0F0; --plan-soft: #232A45;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.4; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-size: 13px; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 22px; border-radius: 14px; border: 2px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; cursor: pointer;
  transition: transform .1s, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }
.btn.sub { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.spark { background: var(--spark); color: var(--spark-ink); }
.btn.wide { width: 100%; }
:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.story b.k { font-family: var(--font-display); }
.meter { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--muted); }
.meter-bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
.m-list { display: flex; flex-direction: column; gap: 10px; }
.m-card {
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px;
  text-align: left; cursor: pointer; width: 100%;
}
.m-card:hover { border-color: var(--accent); }
.m-num { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 18px; }
.m-card.done .m-num { background: var(--accent); color: var(--accent-ink); }
.m-card .t { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.4; }
.m-card .d { font-size: 14px; color: var(--muted); line-height: 1.5; }
.m-card .st { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.m-card.done .st { color: var(--good); }

/* Mission */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 8px 0; min-height: 44px; }
.goalcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.goalcard .lead { font-size: 16px; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.55; padding: 8px 12px; border-radius: 10px; background: var(--desk); transition: background .3s; }
.goals li::before { content: ""; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); font-weight: 700; }
.goals li.ok { background: var(--good-soft); }
.goals li.ok::before { content: "✓"; background: var(--good); border-color: var(--good); }
.goals li.ok.just { animation: pop .4s ease; }

.desk { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.desk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--desk); border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.desk-head .app { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.files { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 4px; }
.file { font-family: var(--font-mono); font-size: 12.5px; background: var(--desk); border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; line-height: 1.4; }
.file:hover { border-color: var(--accent); }
.file.open { border-color: var(--accent); background: var(--accent-soft); }
.file.changed { border-color: var(--spark); }
.file.changed::after { content: " ●"; color: var(--spark); }
.file.new { animation: pop .4s ease both; }
.files-hint { font-size: 12px; color: var(--muted); padding: 0 14px 8px; }
.viewer { margin: 0 14px 10px; border: 1.5px solid var(--accent); border-radius: 12px; overflow: hidden; }
.viewer-head { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); padding: 4px 6px 4px 12px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
.viewer-head button { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--muted); min-height: 36px; padding: 0 10px; }
.viewer pre { margin: 0; padding: 10px 12px; font-family: var(--font-body); font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; background: var(--surface); }

.chat { display: flex; flex-direction: column; gap: 10px; padding: 14px; min-height: 180px; max-height: 460px; overflow-y: auto; border-top: 1px solid var(--line); background: var(--desk); }
.msg { max-width: 92%; border-radius: 14px; padding: 10px 14px; font-size: 15.5px; line-height: 1.7; animation: rise .3s ease both; white-space: pre-wrap; word-break: break-word; }
.msg.you { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.ai::before { content: "Claude"; display: block; font-family: var(--font-mono); font-size: 11px; color: var(--spark); font-weight: 600; margin-bottom: 2px; }
.msg.sys { align-self: stretch; max-width: none; background: var(--spark-soft); font-size: 14px; border-radius: 12px; }
.msg.sys::before { content: "ガイド "; font-weight: 700; color: var(--spark); }
.act { align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); animation: rise .25s ease both; }
.tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.w { background: var(--spark-soft); color: var(--spark); }
.tag.x { background: var(--bad-soft); color: var(--bad); }
.tag.p { background: var(--plan-soft); color: var(--plan); }
.act .fn { font-family: var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }
.act.working .fn::after { content: " …"; animation: blink 1s steps(2) infinite; }

.perm { align-self: stretch; background: var(--surface); border: 2px solid var(--spark); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; animation: rise .3s ease both; }
.perm .q { font-weight: 700; font-size: 15.5px; }
.perm .en { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.perm pre, .plan-card pre { margin: 0; font-family: var(--font-body); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; border-radius: 8px; padding: 8px 10px; max-height: 220px; overflow: auto; }
.perm pre.new { background: var(--good-soft); }
.perm pre.old { background: var(--bad-soft); text-decoration: line-through; text-decoration-color: var(--bad); }
.perm .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.perm .opts { display: flex; flex-direction: column; gap: 6px; }
.perm .opts button { text-align: left; border: 1.5px solid var(--line); background: var(--desk); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 15px; line-height: 1.45; min-height: 46px; }
.perm .opts button:hover:not(:disabled) { border-color: var(--accent); }
.perm .opts button:disabled { cursor: default; opacity: .4; }
.perm .opts button.chosen { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.plan-card { align-self: stretch; background: var(--plan-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: rise .3s ease both; }
.plan-card .q { font-weight: 700; color: var(--plan); }
.plan-card ol { margin: 0; padding-left: 1.4em; font-size: 15px; line-height: 1.7; }
.plan-card ol li.ok { color: var(--muted); text-decoration: line-through; }

.controls { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mode-btn { display: inline-flex; flex-direction: column; align-items: flex-start; border: 2px solid var(--line); background: var(--desk); border-radius: 12px; padding: 4px 12px; cursor: pointer; line-height: 1.35; min-height: 46px; justify-content: center; }
.mode-btn b { font-size: 14.5px; }
.mode-btn small { font-size: 11px; color: var(--muted); }
.mode-btn.auto { border-color: var(--spark); background: var(--spark-soft); }
.mode-btn.plan { border-color: var(--plan); background: var(--plan-soft); }
.mode-btn.flash { animation: ring 1.2s ease 2; }
.small-btn { border: 2px solid var(--line); background: var(--desk); border-radius: 12px; padding: 0 14px; min-height: 46px; cursor: pointer; font-size: 14.5px; font-weight: 700; }
.stop-btn { border: none; background: var(--bad); color: #FFFFFF; border-radius: 12px; padding: 0 18px; min-height: 46px; cursor: pointer; font-size: 15px; font-weight: 700; margin-left: auto; animation: ring 1s ease infinite; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .lab { width: 100%; font-size: 12px; color: var(--muted); }
.chip { border: 1.5px dashed var(--accent); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; text-align: left; line-height: 1.45; }
.chip:hover { background: var(--accent-soft); }
.inbox { display: flex; gap: 8px; }
.inbox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); color: var(--ink); }
.inbox input:focus { border-color: var(--accent); outline: none; }
.inbox button { flex-shrink: 0; border: none; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 12px; padding: 0 18px; cursor: pointer; min-height: 48px; }
.inbox button:disabled, .inbox input:disabled { opacity: .45; cursor: not-allowed; }

.clear { background: var(--surface); border: 2px solid var(--good); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: rise .4s ease both; }
.clear-top { display: flex; align-items: center; gap: 14px; }
.stamp { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--spark); color: var(--spark); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; transform: rotate(-8deg); flex-shrink: 0; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) both; }
.tip { background: var(--desk); border-radius: 12px; padding: 12px 14px; font-size: 15.5px; }
.tip b { color: var(--accent); }

.panel { background: var(--surface); border-radius: 18px; padding: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
ol.tips, ul.tips { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ring { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px var(--spark-soft); } }
@keyframes stamp { from { transform: scale(2) rotate(-8deg); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
@media (max-width: 420px) {
  body { font-size: 16px; }
  h1 { font-size: 26px; }
  .m-card { grid-template-columns: 40px 1fr; }
  .m-card .st { grid-column: 2; }
  .m-num { width: 40px; height: 40px; font-size: 16px; }
  .chat { max-height: 400px; }
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
(function () {
  'use strict';

  /* ---------- per-viewer progress ---------- */
  var KEY = 'claude-code-jitsumu-v1';
  function loadDone() { try { var v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function saveDone() { try { localStorage.setItem(KEY, JSON.stringify(doneList)); } catch (e) {} }
  var doneList = loadDone();

  var app = document.getElementById('app');
  function h(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function has(t) { for (var i = 1; i < arguments.length; i++) if (t.indexOf(arguments[i]) !== -1) return true; return false; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- sample files ---------- */
  var MEMO = '11/4 定例 メモ\n参加：佐藤、鈴木、田中\n・年末イベントは12/14(土)に決定\n・会場は市民ホール。鈴木さんが予約する\n・チラシは田中さん、11/20までに案\n・予算は前年と同じ5万円\n・次回は11/18';
  var CSV = '回答者,満足度,よかった点\nA,5,講師の説明\nB,4,資料\nC,3,時間\nD,5,講師の説明\nE,4,会場\nF,5,講師の説明\nG,4,資料\nH,4,資料';
  var DRAFT = '年末イベントやります。12/14です。市民ホールでやるので来てください。申し込みは鈴木まで。';
  function minutes(style) {
    if (style === 'short') return '# 議事録（11/4）\n- 12/14(土) 市民ホールで年末イベント\n- 予算5万円\n- 鈴木さん：会場予約／田中さん：チラシ案（11/20まで）\n- 次回 11/18';
    var todo = style === 'table'
      ? '## やること\n| やること | 担当 | 締切 |\n|---|---|---|\n| 会場の予約 | 鈴木さん | （メモに記載なし） |\n| チラシの案 | 田中さん | 11月20日 |'
      : '## やること\n- 会場の予約：鈴木さん\n- チラシの案：田中さん（11月20日まで）';
    return '# 定例会議 議事録（11月4日）\n\n参加者：佐藤、鈴木、田中\n\n## 決まったこと\n- 年末イベントは12月14日（土）に開催\n- 会場は市民ホール\n- 予算は前年と同じ5万円\n\n' + todo + '\n\n## 次回\n11月18日';
  }
  function annai(o) {
    if (o.short) return '年末イベントのご案内\n\n12月14日（土）' + (o.time ? '13時〜16時に' : '') + '、市民ホールで年末イベントを開催します。\nお申し込みは鈴木までお願いいたします。';
    return '年末イベントのご案内\n\n日ごろよりお世話になっております。\n下記のとおり年末イベントを開催いたします。ぜひご参加ください。\n\n日時：12月14日（土）' + (o.time ? ' 13:00〜16:00' : '') + '\n会場：市民ホール\nお申し込み：鈴木まで\n\nみなさまのご参加をお待ちしております。';
  }
  var SUM_PLAIN = '11月4日の定例会議のメモです。年末イベントを12月14日（土）に市民ホールで開くことが決まりました。予算は前年と同じ5万円で、次回の会議は11月18日です。';
  var SUM_RULED = '結論：年末イベントは12月14日（土）に市民ホールで開催します。\n\n・会場の予約 … 鈴木さん（締切はメモに記載がありません）\n・チラシの案 … 田中さん／11月20日まで\n・予算 … 前年と同じ5万円\n\n次回の会議は11月18日です。';
  var CLAUDE_MD = '# 仕事のルール\n- 文章は敬語で書く\n- まとめるときは、最初に結論を1行で書く\n- 「だれが」「いつまでに」を必ず書く';
  function report(graph) {
    return '# アンケート集計レポート\n\n回答数：8人\n満足度の平均：4.3（5点満点）\n\n## よかった点\n| よかった点 | 人数 |\n|---|---|\n| 講師の説明 | 3 |\n| 資料 | 3 |\n| 会場 | 1 |\n| 時間 | 1 |\n' +
      (graph ? '\n## グラフ\n満足度5 ■■■ 3人\n満足度4 ■■■■ 4人\n満足度3 ■ 1人\n' : '') +
      '\n## ひとこと\n「講師の説明」と「資料」の評価が高く、満足度3は1人だけでした。';
  }
  var MEMO_PROSE = '11月4日に定例会議を行いました。参加者は佐藤さん、鈴木さん、田中さんです。会議では、年末イベントの日程と会場について話し合いました。';

  /* ---------- engine ---------- */
  var S = null; // current mission state
  var MODES = {
    normal: { name: 'ふつう', sub: '変えるときは毎回聞く' },
    auto: { name: '自動OK', sub: '書きかえを聞かずに進める' },
    plan: { name: '計画', sub: '読むだけ。計画を立てる' }
  };
  var ORDER = ['normal', 'auto', 'plan'];

  var api = {
    say: function (who, text, isHtml) {
      var m = h('<div class="msg ' + who + '"></div>');

          c.snap = null;
          api.say('ai', '作業の前の状態に戻しました。会議メモ_1104.txt も元どおりです。');
          api.say('sys', '本物では /rewind と打つか、Esc キーを2回押すと巻き戻せます。');
          api.goal('b');
          return;
        }
        var clear = has(t, 'だけ', '変えないで', 'かえないで', 'そのまま', '触らないで', 'さわらないで');
        if (has(t, '整え', 'ととの', 'きれい', '整理', '見やすく', '片付')) {
          c.snap = clone(S.files);
          if (clear) {
            api.act('読む', '議事録_1104.md', true);
            if (!await api.wait(900)) return;
            var a1 = S.files['議事録_1104.md'].replace(/^## (?![■◆])/gm, '## ■ ');
            var v1 = await api.permit({ kind: '直す', file: '議事録_1104.md', before: S.files['議事録_1104.md'], after: a1 });
            if (v1 !== 'yes' && v1 !== 'always') return;
            api.setFile('議事録_1104.md', a1);
            api.say('ai', '議事録_1104.md の見出しだけ整えました。会議メモ_1104.txt には触れていません。');
            api.goal('c');
            return;
          }
          api.goal('a');
          c.running = true;
          api.act('読む', '仕事フォルダ', true);
          if (!await api.wait(900)) return;
          var a2 = S.files['議事録_1104.md'].replace(/^## (?![■◆])/gm, '## ◆ ');
          var v2 = await api.permit({ kind: '直す', file: '議事録_1104.md', before: S.files['議事録_1104.md'], after: a2 });
          if (v2 !== 'yes' && v2 !== 'always') { c.running = false; return; }
          api.setFile('議事録_1104.md', a2);
          if (!await api.wait(900)) return;
          api.say('ai', '会議メモ_1104.txt も、見やすい文章に書きかえます。');
          api.act('直す', '会議メモ_1104.txt', true);
          api.say('sys', 'あれ？ 会議メモは元のまま残しておきたいのに…！ 下の赤い「止める」ボタンを押して！');
          if (!await api.wait(4500)) return;
          document.querySelectorAll('.act.working').forEach(function (a) { a.classList.remove('working'); });
          api.setFile('会議メモ_1104.txt', MEMO_PROSE);
          c.running = false;
          api.say('ai', 'すべてのファイルを整えました。');
          api.say('sys', '会議メモが書きかえられて、元のメモが消えてしまいました！ でも大丈夫。「元に戻して」と頼めば戻せます。');
          return;
        }
        if (!await api.wait(600)) return;
        api.say('ai', 'どのファイルを、どうしたいですか？');
      },
      tip: '<b>まちがいに気づいたら、すぐ「止める」（Esc キー）。</b>やってしまったあとでも「元に戻して」（/rewind）で戻せます。頼むときは<b>「〇〇だけ」「〇〇は変えないで」</b>と範囲をはっきり書くと、まちがいが減ります。'
    },
    {
      title: 'いつものルールを覚えさせる',
      short: 'CLAUDE.md に書いておく',
      lead: 'Claude Code は、新しい会話になると前の話を忘れます。毎回伝えたいルールは「CLAUDE.md」というメモに書いておくと、毎回読んで守ってくれます。',
      newChat: true,
      files: function () { return { '会議メモ_1104.txt': MEMO, 'アンケート結果.csv': CSV }; },
      goals: [
        { id: 'a', text: 'いつものルールを CLAUDE.md に書いてもらう' },
        { id: 'b', text: '「新しい会話」ボタンを押して、会話をリセットする' },
        { id: 'c', text: '会議メモのまとめを頼んで、ルールが守られるか確かめる' }
      ],
      chips: function (S) {
        var c = [];
        if (!S.goals.a) {
          if (!S.ctx.before) c.push('会議メモをまとめて');
          c.push('毎回のルールを CLAUDE.md に書いておいて：敬語で、最初に結論、だれがいつまでにを必ず書く');
          return c;
        }
        if (S.goals.b && !S.goals.c) return ['会議メモをまとめて'];
        return [];
      },
      hint: function (S) { return S.goals.a && !S.goals.b ? '下の「新しい会話」ボタンを押してみよう' : ''; },
      intro: function (api) { api.say('sys', 'まずは「会議メモをまとめて」と頼んで、ふだんのまとめ方を見ておくと、あとで違いがよくわかります。'); },
      onNewChat: function (api, S) {
        api.say('sys', '新しい会話です。前の話は覚えていません。でも CLAUDE.md だけは、毎回最初に読みます。（本物では /clear）');
        if ('CLAUDE.md' in S.files) api.goal('b');
      },
      onSend: async function (t, api, S) {
        if (has(t, 'CLAUDE', 'claude', 'ルール', '覚え', 'いつも', '毎回')) {
          api.act('読む', '仕事フォルダ', true);
          if (!await api.wait(800)) return;
          var exists = 'CLAUDE.md' in S.files;
          api.say('ai', 'CLAUDE.md にルールを書きます。次からは、会話が変わってもこのルールを守ります。');
          var v = await api.permit({ kind: exists ? '直す' : '作る', file: 'CLAUDE.md', before: exists ? S.files['CLAUDE.md'] : null, after: CLAUDE_MD });
          if (v === 'yes' || v === 'always') {
            api.setFile('CLAUDE.md', CLAUDE_MD);
            api.say('ai', '書きました。');
            api.goal('a');
            api.say('sys', '「新しい会話」ボタンで会話をリセットしても、覚えているかな？');
          } else if (v === 'no') api.say('ai', 'わかりました。どんなルールにしますか？');
          return;
        }
        if (has(t, '会議', 'メモ', 'まとめ')) {
          var ruled = 'CLAUDE.md' in S.files;
          if (ruled) api.act('読む', 'CLAUDE.md');
          api.act('読む', '会議メモ_1104.txt', true);
          if (!await api.wait(1000)) return;
          api.say('ai', ruled ? SUM_RULED : SUM_PLAIN);
          if (!ruled) { S.ctx.before = true; api.say('sys', 'これが、ふだんのまとめ方。次は、いつものルールを CLAUDE.md に書いてもらおう。'); }
          else if (S.goals.b) { api.goal('c'); api.say('sys', '会話をリセットしても、「結論が先」「だれが・いつまでに」のルールが守られています！'); }
          else api.say('sys', 'ルールどおりになりました。「新しい会話」にしても覚えているか、確かめてみよう。');
          return;
        }
        if (!await api.wait(600)) return;
        api.say('ai', '何をしましょうか？');
      },
      tip: '<b>毎回伝えたいことは CLAUDE.md へ。</b>会話が変わっても、起動するたびに読まれる「いつものお願いメモ」です。ただし<b>パスワードや個人情報は書かない</b>こと。本物では /init と打つと、ひな形を作ってくれます。'
    }
  ];

  function showPlan(api, S) {
    var items = ['アンケート結果.csv の8人分を読む', '満足度の平均を出す', '「よかった点」を種類ごとに数えて表にする'];
    if (!S.ctx.edited) items.push('満足度のグラフを入れる');
    items.push('レポート.md に保存する');
    api.plan(items, function (card) {
      run(async function () {
        api.setMode('normal');
        api.say('sys', '計画をOKすると、「計画」モードが終わって作業が始まります。');
        var lis = card.querySelectorAll('li');
        for (var i = 0; i < lis.length - 1; i++) {
          if (!await api.wait(700)) return;
          lis[i].classList.add('ok');
        }
        var after = report(!S.ctx.edited);
        var v = await api.permit({ kind: '作る', file: 'レポート.md', after: after });
        if (v === 'yes' || v === 'always') {
          lis[lis.length - 1].classList.add('ok');
          api.setFile('レポート.md', after);
          api.say('ai', 'レポート.md を作りました。');
          api.goal('c');
        } else if (v === 'no') {
          api.say('ai', 'わかりました、保存はやめておきます。どう変えますか？');
        }
      });
    });
  }

  /* ---------- rendering ---------- */
  function renderHome() {
    S = null;
    var n = doneList.length;
    var html =
      '<header class="hero">' +
      '<p class="eyebrow">AIがはじめての人のための 実務練習</p>' +
      '<h1>Claude Code 実務練習帳</h1>' +
      '<p>説明を読むより、まず触ってみる。ふだんの事務仕事を Claude Code に頼みながら、使い方を体で覚えます。本物のAIやパソコンにはつながっていないので、どこを押しても大丈夫です。</p>' +
      '</header>' +
      '<div class="story"><b class="k">今日の設定</b><p>あなたは小さな会社の事務担当。パソコンの「仕事フォルダ」には、会議メモやアンケートが入っています。今日から <b>Claude Code</b> が、となりの席のアシスタントです。</p>' +
      '<p class="muted" style="font-size:14px">Claude Code は、あなたのフォルダの中のファイルを読んだり、作ったり、書きかえたりできるAIです。ふつうの日本語で頼めます。</p></div>' +
      '<div class="meter"><span>' + n + ' / 6 クリア</span><div class="meter-bar"><div class="meter-fill" style="width:' + (n / 6 * 100) + '%"></div></div></div>' +
      '<div class="m-list">';
    MISSIONS.forEach(function (m, i) {
      var d = doneList.indexOf(i) !== -1;
      html += '<button class="m-card' + (d ? ' done' : '') + '" data-i="' + i + '"><span class="m-num">' + (d ? '✓' : i + 1) + '</span>' +
        '<span><span class="t">' + m.title + '</span><br><span class="d">' + m.short + '</span></span>' +
        '<span class="st">' + (d ? 'クリア' : 'ミッション ' + (i + 1)) + '</span></button>';
    });
    html += '</div>';
    if (n === 6) html += '<button class="btn wide spark" id="fin">まとめを見る</button>';
    app.innerHTML = html;
    app.querySelectorAll('.m-card').forEach(function (b) { b.onclick = function () { startMission(+b.dataset.i); }; });
    var f = document.getElementById('fin'); if (f) f.onclick = renderFinish;
    window.scrollTo(0, 0);
  }

  function startMission(i) {
    if (S) S.token++;
    var def = MISSIONS[i];
    S = { i: i, def: def, files: def.files(), changed: {}, mode: def.mode || 'normal', busy: false, token: 0, goals: {}, ctx: {}, allowAll: false, pending: null, viewing: null };
    app.innerHTML =
      '<div class="topbar"><button class="back" id="back">← ミッション一覧</button><span class="eyebrow">ミッション ' + (i + 1) + ' / 6</span></div>' +
      '<h2>' + def.title + '</h2>' +
      '<section class="goalcard"><p class="lead">' + def.lead + '</p><ul class="goals" id="goals"></ul></section>' +
      '<section class="desk">' +
        '<div class="desk-head"><span>📁 仕事フォルダ</span><span class="app">Claude Code</span></div>' +
        '<div class="files" id="files"></div><div class="files-hint">ファイル名をタップすると中身が見られます</div>' +
        '<div class="viewer" id="viewer" hidden><div class="viewer-head"><span id="vname"></span><button id="vclose">閉じる ×</button></div><pre id="vbody"></pre></div>' +
        '<div class="chat" id="chat" aria-live="polite"></div>' +
        '<div class="controls">' +
          '<div class="ctl-row"><button class="mode-btn" id="modeb"></button>' + (def.newChat ? '<button class="small-btn" id="newchat">新しい会話</button>' : '') + '<button class="stop-btn" id="stop" hidden>■ 止める</button></div>' +
          '<div class="chips" id="chips"></div>' +
          '<form class="inbox" id="form"><input id="inp" type="text" autocomplete="off" placeholder="Claude にお願いを書く…" aria-label="お願いを書く"><button id="send" type="submit">送る</button></form>' +
        '</div>' +
      '</section>' +
      '<div id="clearbox"></div>';
    document.getElementById('back').onclick = function () { S.token++; renderHome(); };
    document.getElementById('vclose').onclick = function () { closeFile(); };
    document.getElementById('modeb').onclick = function () {
      if (S.busy) return;
      this.classList.remove('flash');
      var m = ORDER[(ORDER.indexOf(S.mode) + 1) % 3];
      S.mode = m; renderMode();
      api.say('sys', 'モードを「' + MODES[m].name + '」にしました。' + (m === 'plan' ? 'ファイルは変えずに、計画だけ立てます。' : m === 'auto' ? 'ファイルの書きかえを聞かずに進めます。' : '書きかえる前に毎回聞きます。'));
      if (def.onMode) def.onMode(m, api, S);
    };
    document.getElementById('stop').onclick = stopNow;
    var nc = document.getElementById('newchat');
    if (nc) nc.onclick = function () {
      if (S.busy) return;
      document.getElementById('chat').innerHTML = '';
      S.allowAll = false;
      def.onNewChat(api, S);
      renderChips();
    };
    document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); send(document.getElementById('inp').value); });
    renderGoals(); renderFiles(); renderMode();
    api.say('ai', 'こんにちは。仕事フォルダを開いています。何をしましょうか？');
    if (def.intro) def.intro(api);
    renderChips();
    window.scrollTo(0, 0);
  }

  function renderGoals(justId) {
    var ul = document.getElementById('goals'); if (!ul) return;
    ul.innerHTML = '';
    S.def.goals.forEach(function (g) {
      var li = document.createElement('li');
      li.textContent = g.text;
      if (S.goals[g.id]) li.className = 'ok' + (g.id === justId ? ' just' : '');
      ul.appendChild(li);
    });
    renderChips();
  }
  function renderFiles(newName) {
    var box = document.getElementById('files'); if (!box) return;
    box.innerHTML = '';
    Object.keys(S.files).forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'file' + (S.viewing === name ? ' open' : '') + (S.changed[name] ? ' changed' : '') + (name === newName ? ' new' : '');
      b.textContent = name;
      b.onclick = function () { if (S.viewing === name) closeFile(); else openFile(name); };
      box.appendChild(b);
    });
  }
  function openFile(name, silent) {
    S.viewing = name;
    document.getElementById('viewer').hidden = false;
    document.getElementById('vname').textContent = name;
    document.getElementById('vbody').textContent = S.files[name];
    renderFiles();
    if (!silent && S.def.onOpen) S.def.onOpen(name, api, S);
    renderChips();
  }
  function closeFile() { S.viewing = null; document.getElementById('viewer').hidden = true; renderFiles(); }
  function renderMode() {
    var b = document.getElementById('modeb'); if (!b) return;
    b.className = 'mode-btn ' + S.mode;
    b.innerHTML = '<b>モード：' + MODES[S.mode].name + '</b><small>' + MODES[S.mode].sub + '（押すと切りかえ）</small>';
  }
  function renderChips() {
    var box = document.getElementById('chips'); if (!box || !S) return;
    box.innerHTML = '';
    var list = S.def.chips(S);
    var hint = S.def.hint ? S.def.hint(S) : '';
    if (list.length) {
      box.appendChild(h('<span class="lab">おすすめのお願い（タップで送信。自分で書いてもOK）</span>'));
      list.forEach(function (t) { var c = document.createElement('button'); c.className = 'chip'; c.type = 'button'; c.textContent = t; c.onclick = function () { send(t); }; box.appendChild(c); });
    }
    if (hint) box.appendChild(h('<span class="lab" style="color:var(--spark);font-weight:700">👉 ' + esc(hint) + '</span>'));
  }

  function showClear() {
    if (!S) return;
    var i = S.i;
    if (doneList.indexOf(i) === -1) { doneList.push(i); saveDone(); }
    var box = document.getElementById('clearbox'); if (!box) return;
    var last = i === MISSIONS.length - 1;
    box.innerHTML = '';
    var c = h('<section class="clear"><div class="clear-top"><div class="stamp">CLEAR</div><div><h3>ミッション ' + (i + 1) + ' クリア！</h3><p class="muted" style="font-size:14px">' + MISSIONS[i].title + '</p></div></div>' +
      '<div class="tip">' + MISSIONS[i].tip + '</div></section>');
    var nb = h('<button class="btn wide' + (last ? ' spark' : '') + '"></button>');
    if (!last) { nb.textContent = 'ミッション ' + (i + 2) + '「' + MISSIONS[i + 1].title + '」へ →'; nb.onclick = function () { startMission(i + 1); }; }
    else { nb.textContent = 'まとめへ →'; nb.onclick = renderFinish; }
    c.appendChild(nb);
    var again = h('<button class="btn wide sub">もう一度このミッションを触る</button>');
    again.onclick = function () { startMission(i); };
    c.appendChild(again);
    box.appendChild(c);
    c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderFinish() {
    S = null;
    app.innerHTML =
      '<div class="topbar"><button class="back" id="back">← ミッション一覧</button><span class="eyebrow">ぜんぶクリア</span></div>' +
      '<section class="clear"><div class="clear-top"><div class="stamp">全制覇</div><div><h2>おつかれさまでした！</h2><p class="muted">「頼む → 確かめる → 任せる」の流れを体験できました。</p></div></div></section>' +
      '<section class="panel"><h3>実務で使うときの6つのコツ</h3><ol class="tips">' +
      '<li>まずは「読んで説明して」から。読むだけならファイルは変わらない。</li>' +
      '<li>「いいですか？」と聞かれたら、中身を読んでから答える。</li>' +
      '<li>一回で完璧をめざさず、会話しながら仕上げる。</li>' +
      '<li>大きな仕事は「計画」モードで段取りを先に見る。</li>' +
      '<li>まちがいに気づいたら、止める・戻す。頼むときは範囲をはっきり。</li>' +
      '<li>毎回のルールは CLAUDE.md に書いておく。</li>' +
      '</ol></section>' +
      '<section class="panel"><h3>本物を使う前に</h3><ul class="tips">' +
      '<li>最初は、大事なファイルのコピーを入れた「練習用フォルダ」で試しましょう。</li>' +
      '<li>パスワードや個人情報は、お願いの文章にも CLAUDE.md にも書かないこと。</li>' +
      '<li>本物の画面は、ボタンや確認の文が英語で表示されることがあります。この練習と同じ場面だと思えば大丈夫です。</li>' +
      '</ul><p><a href="https://code.claude.com/docs" target="_blank" rel="noopener">Claude Code 公式ドキュメント</a></p></section>' +
      '<button class="btn wide sub" id="reset">記録をリセットする</button>';
    document.getElementById('back').onclick = renderHome;
    var r = document.getElementById('reset');
    r.onclick = function () {
      if (r.dataset.armed) { doneList = []; saveDone(); renderHome(); return; }
      r.dataset.armed = '1'; r.textContent = 'もう一度押すとリセットします';
    };
    window.scrollTo(0, 0);
  }

  renderHome();
})();
</script>
</body>
</html>
