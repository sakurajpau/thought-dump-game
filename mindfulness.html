  '現代でもっとも広く使われるのは、ジョン・カバットジンによる説明です。要約すると[[意図的に、今この瞬間に、評価をせずに注意を向けることで生まれる気づき]]。1994年の著書では「特別な形で注意を払うこと。意図的に、今この瞬間に、評価をせずに」と書かれ、2003年の論文では「気づき」という言葉が加わるなど、表現は著作によって少しずつ違います。',

{ id: '1-2', u: 0, th: '理論', t: '2つの柱：注意と態度', g: '注意の調整と受容的な態度の両方が必要な理由を説明できる', b: [

{ id: '1-3', u: 0, th: '理論', t: '土台となる7つの態度', g: '7つの態度を挙げ、それぞれの意味を説明できる', b: [
  'カバットジンは著書の中で、実践の土台として7つの態度を挙げています。',
  '①[[評価しない]]：判定している自分に気づく。②[[忍耐]]：物事にはそれぞれの時間があると認める。③[[初心（ビギナーズ・マインド）]]：初めて見るかのように体験する。④[[信頼]]：自分の感覚を信頼する。',
  '⑤[[がんばらない]]：特定の状態に到達しようとしない。⑥[[受容]]：今あるものを、まずあるがままに認める。⑦[[手放す]]：しがみつかず、押しのけもしない。',
  '受容は「あきらめ」や「賛成」ではありません。今の現実を正確に見ることで、次の行動を選べるようになる、という意味です。'],
  p: ['評価しない・忍耐・初心・信頼・がんばらない・受容・手放す', '受容はあきらめではなく、現実を正確に見ること', '態度は「身につける技術」として練習する'] },
{ id: '1-4', u: 0, th: '理論', t: '集中瞑想と観察瞑想', g: '2種類の瞑想スタイルの違いを説明できる', b: [
  '瞑想の方法は大きく2つに分けられます。1つは[[集中瞑想（フォーカスト・アテンション）]]。呼吸など1つの対象に注意を置き、それたら戻します。',
  'もう1つは[[観察瞑想（オープン・モニタリング）]]。対象を1つに決めず、音・感覚・思考など、その瞬間に現れるものを反応せずに観察します。',
  '仏教の用語では、集中で心を静める実践を[[サマタ（止）]]、ありのままを観察する実践を[[ヴィパッサナー（観）]]と呼び、おおまかに対応します。',
  '多くのプログラムは集中瞑想から始めます。注意がある程度安定してから観察瞑想に進むと取り組みやすいためです。'],
  p: ['集中瞑想＝1つの対象に注意を置いて戻す', '観察瞑想＝現れるものを選ばず観察する', 'サマタ（止）とヴィパッサナー（観）におおむね対応'] },
{ id: '1-5', u: 0, th: '理論', t: 'よくある誤解', g: '代表的な誤解を訂正できる', b: [
  '[[「無になること」ではありません。]]考えは浮かんで当たり前で、止める必要はありません。考えが浮かんだと気づけたら、その瞬間がマインドフルです。',
  '[[「リラックス法」でもありません。]]落ち着くことは結果として起こりますが、目的は気づくことです。緊張していれば「緊張がある」と気づくのが実践です。',
  '[[「ポジティブ思考」でもありません。]]不快な感覚や感情を良いものに書き換えるのではなく、そのまま観察します。',
  '「現実逃避」「感情を消す方法」「特定の宗教の実践」というのも誤解です。現代のプログラムは宗教色を除いた心のトレーニングとして作られています。また、万能薬でもありません（第4章）。'],
  p: ['無になる・リラックス・ポジティブ思考とは別のもの', '「それた」と気づくことは失敗ではなく成功', '万能薬ではない'] },

{ id: '2-1', u: 1, th: '歴史', t: 'ルーツ：仏教の「サティ」', g: 'サティと四念処を説明できる', b: [
  'マインドフルネスの語源は、パーリ語の[[サティ（sati）]]です。「気づき」「心にとどめておくこと」という意味で、漢訳は「念」。サンスクリット語ではスムリティといいます。',
  'サティは、ブッダが説いた苦しみを減らすための8つの実践の道[[八正道]]の7番目、[[正念]]にあたります。',
  '実践の具体的な方法は[[『念処経』（サティパッターナ・スッタ）]]にまとめられています。気づきを向ける4つの領域が[[四念処]]です。身（体と呼吸）、受（快・不快・どちらでもないという感じ）、心（心の状態）、法（心に現れる現象とその法則）。',
  '呼吸への気づきは[[入出息念（アーナーパーナサティ）]]と呼ばれ（出入息念、安般念とも書きます）、現代の呼吸瞑想の原型になっています。'],
  p: ['サティ＝パーリ語で「気づき」、漢訳は「念」', '八正道の正念にあたる', '四念処＝身・受・心・法'] },
{ id: '2-2', u: 1, th: '歴史', t: '西洋への伝わり方', g: '19〜20世紀に瞑想が西洋へ広まった流れを説明できる', b: [
  '[[1881年]]、イギリスの仏教学者リス・デイヴィッズがサティの訳語として[[mindfulness]]を用いました。これが英語として定着していきます。',
  'ミャンマーでは20世紀前半にレディ・サヤドーらが、1949年以降はマハーシ・サヤドーらが、出家者でない人にも取り組める形でヴィパッサナー瞑想を広めました。日本からは鈴木大拙が禅を英語で紹介します。',
  '1960〜70年代、アメリカで東洋の瞑想への関心が高まります。[[1970年]]に鈴木俊隆『禅マインド ビギナーズ・マインド』、[[1975年]]にベトナムの禅僧ティク・ナット・ハン『The Miracle of Mindfulness』（邦訳『〈気づき〉の奇跡』）が出版されました。',
  '同じ1975年、アジアで修行したゴールドスタイン、コーンフィールド、サルツバーグが[[インサイト・メディテーション・ソサエティ（IMS）]]を設立。翌1976年にマサチューセッツ州バリーに瞑想センターが開き、西洋人による指導の拠点ができました。'],
  p: ['1881年 リス・デイヴィッズがsatiをmindfulnessと訳す', '1970年代、禅とヴィパッサナーがアメリカに広まる', '1975年 IMS設立（センターは1976年に開く）'] },
{ id: '2-3', u: 1, th: '歴史', t: 'MBSRの誕生（1979年）', g: 'MBSRの成り立ちと構成を説明できる', b: [
  '分子生物学の博士号を持ち、禅やヴィパッサナーを学んでいた[[ジョン・カバットジン]]は、[[1979年]]にマサチューセッツ大学医療センターで「ストレス低減クリニック」を始めました。',
  '対象は、慢性の痛みなど通常の治療だけでは苦しみが残る患者。瞑想を仏教の文脈から切り離し、誰でも参加できる医療の補助プログラムにしたのが[[MBSR（マインドフルネスストレス低減法）]]です。',
  '構成は[[8週間]]。週1回およそ2時間半のグループセッション、途中に1日の集中実践、そして週6日、1日45分以上の自宅練習。内容はボディスキャン、静坐瞑想、マインドフル・ヨーガなどです。',
  '1982年に慢性疼痛患者51人への最初の研究論文が出され（当時のプログラムは10週間）、1990年の著書『Full Catastrophe Living』（邦訳『マインドフルネスストレス低減法』）で一般にも知られるようになりました。'],
  p: ['1979年、カバットジンがマサチューセッツ大学で開始', '8週間・週1回のグループ＋毎日の自宅練習', '宗教色を除いた医療の補助プログラム'] },
{ id: '2-4', u: 1, th: '歴史', t: '心理療法への統合', g: 'MBCT・DBT・ACTの特徴を区別できる', b: [
  '1990年代以降、マインドフルネスは心理療法に組み込まれ、行動療法・認知療法に続く[[「第3世代の認知行動療法」]]と呼ばれる流れを作りました。',
  '[[MBCT（マインドフルネス認知療法）]]：シーガル、ウィリアムズ、ティーズデールが開発。MBSRの構成に認知療法を組み合わせ、[[うつ病の再発予防]]を目的とします。2000年に臨床試験、2002年に治療マニュアルが発表されました。2004年にはイギリスのNICEの診療ガイドラインに取り上げられ、2009年の改訂で、うつ病を3回以上経験した人の再発予防として推奨されています（現在の指針にこの回数の条件はありません）。',
  '[[DBT（弁証法的行動療法）]]：マーシャ・リネハンが1993年に体系化。境界性パーソナリティ障害などを対象に、マインドフルネスを中核スキルの1つとします。',
  '[[ACT（アクセプタンス＆コミットメント・セラピー）]]：スティーブン・ヘイズらが1999年に体系化。思考と距離を取り、不快な体験を受け入れながら、自分の価値に沿って行動することを目指します。'],
  p: ['MBCT＝うつ病の再発予防（シーガルら）', 'DBT＝リネハン、ACT＝ヘイズ', 'まとめて「第3世代の認知行動療法」'] },
{ id: '2-5', u: 1, th: '歴史', t: '社会への広がりと批判', g: '2000年代以降の広がりと、それに対する批判を説明できる', b: [
  '[[2007年]]、グーグルで社内研修「サーチ・インサイド・ユアセルフ（SIY）」が始まり、企業への導入が進みます。学校教育、スポーツ、刑務所、軍などにも広がりました。',
  '[[2014年]]にはアメリカの『TIME』誌が「マインドフル革命」を表紙で特集。2015年にはイギリス議会の超党派グループが、医療・教育・職場・司法での活用を提言する報告書『Mindful Nation UK』を出しました。日本では2013年に日本マインドフルネス学会が設立されています。',
  '一方で批判もあります。倫理や社会への視点を切り落とし、個人のストレス対処や生産性向上の道具として商品化されているという[[「マクマインドフルネス」]]批判です。この言葉は2010年ごろに心理療法家のマイルズ・ニールが使い、2013年のパーサーとロイの記事「マクマインドフルネスを超えて」で広く知られるようになりました。',
  '研究面でも、効果が実際以上に宣伝されているという指摘があります（第4章）。広がりと同時に、質と誠実さが問われる段階に入っています。'],
  p: ['2007年グーグルのSIY、2014年TIME誌の特集', '2013年 日本マインドフルネス学会設立', '商品化への「マクマインドフルネス」批判'] },

{ id: '3-1', u: 2, th: '心理', t: '自動操縦とさまよう心', g: 'マインドワンダリングとは何か、その影響を説明できる', b: [
  '通い慣れた道を歩いていて、気づいたら着いていた。これは[[自動操縦]]の状態です。習慣化された行動は便利ですが、その間、心は別のところにあります。',
  '今していることと関係のないことを考えている状態を[[マインドワンダリング（心のさまよい）]]といいます。',
  '2010年、キリングスワースとギルバートはスマートフォンで約2,250人の日常を調べ、[[回答の46.9％で、今していることとは別のことを考えていた]]と報告しました。さらに、心がさまよっているときは、そうでないときより幸福度が低い傾向がありました。',
  'さまようこと自体は、計画や創造にも役立つ心の自然なはたらきです。問題は、気づかないまま不安や後悔のループに巻き込まれることです。'],
  p: ['自動操縦＝行動と心が別々の状態', '起きている時間の約47％は心がさまよっている（2010年の研究）', '問題は「気づかないまま」巻き込まれること'] },
{ id: '3-2', u: 2, th: '心理', t: '注意の4ステップ', g: '瞑想中に起きる注意のサイクルを説明できる', b: [
  '呼吸瞑想の最中に起きていることは、4つのステップの繰り返しです。①呼吸に[[集中する]]、②心が[[さまよう]]、③さまよっていたと[[気づく]]、④注意を呼吸に[[戻す]]。',
  '2012年、ハーゼンカンプらは瞑想中の脳を調べ、この4つの局面でそれぞれ違う脳のネットワークがはたらくことを示しました。',
  '大事なのは③です。[[「それた」と気づいた瞬間こそ、マインドフルネスが起きている瞬間]]です。筋トレでいえば、ダンベルを持ち上げる1回にあたります。',
  'だから、何度もそれることは失敗ではありません。10回それて10回戻れば、10回分の練習になります。戻すときに自分を責めないことも練習の一部です。'],
  p: ['集中→さまよう→気づく→戻す', '「気づく」瞬間が練習の核心', 'それる回数が多い＝練習の回数が多い'] },
{ id: '3-3', u: 2, th: '心理', t: '反すうと脱中心化', g: '反すうと脱中心化を説明できる', b: [
  '嫌な出来事や自分の欠点について、同じことをぐるぐる考え続けるのが[[反すう]]です。問題解決のように感じられますが、気分の落ち込みを長引かせやすく、うつ病の発症とも関係することが研究で示されています。未来についての繰り返しの考えは「心配」と呼ばれます。',
  'MBCTの理論では、気分が少し落ちたときに否定的な考えのパターンが自動的に動き出すことが、再発の引き金になると考えます。',
  'これに対する鍵が[[脱中心化]]。考えを「事実」や「自分そのもの」ではなく、[[心に浮かんでは消える出来事]]として見ることです。「私はダメだ」ではなく「『私はダメだ』という考えが浮かんでいる」と捉え直します。',
  '考えの中身を変えようとするのではなく、考えとの関係を変える。これが従来の認知療法との違いです。'],
  p: ['反すう＝同じ考えを繰り返し、落ち込みを長引かせる', '脱中心化＝考えを「心の出来事」として見る', '中身ではなく、考えとの関係を変える'] },
{ id: '3-4', u: 2, th: '心理', t: '「すること」と「あること」', g: '2つの心のモードの違いを説明できる', b: [
  '[[することモード（doing）]]は、今の状態と理想の状態を比べ、その差を埋めようとする心のはたらきです。仕事や家事など、外の世界の課題には非常に有効です。',
  'ところが、同じやり方を気分に向けると裏目に出ます。「なぜ私は落ち込んでいるのか」「本当はこうあるべきなのに」と差を見つめ続けることが、反すうを生みます。',
  '[[あることモード（being）]]は、何かを変えようとせず、今の体験をそのまま受け取る状態です。目標に向かうのではなく、今ここにとどまります。',
  'マインドフルネスの練習は、することモードをなくすことではありません。[[今どちらのモードにいるかに気づき、必要に応じて切り替えられる]]ようになることです。'],
  p: ['することモード＝差を埋めようとする（課題解決向き）', 'あることモード＝今の体験をそのまま受け取る', '気づいて切り替えられることが目標'] },
{ id: '3-5', u: 2, th: '心理', t: '二本の矢：痛みと苦しみ', g: '「第二の矢」のたとえと体験の回避を説明できる', b: [
  '仏典に[[二本の矢]]のたとえがあります。体の痛みや嫌な出来事という[[第一の矢]]は誰にでも刺さり、避けられません。',
  'それに対して「なぜ私だけ」「もうおしまいだ」と抵抗し、嘆き、考え続けることが[[第二の矢]]。こちらは自分で自分に刺している矢で、苦しみを何倍にもします。',
  '不快な感覚や感情を感じないように避けたり抑えたりすることを[[体験の回避]]といいます。短期的には楽になりますが、さまざまな心理的な問題と関連することが報告されています（因果関係まではっきりしているわけではありません）。',
  'マインドフルネスが目指すのは、第一の矢をなくすことではなく、第二の矢に気づいて打つのを減らすこと。そのための態度が[[受容（アクセプタンス）]]です。'],
  p: ['第一の矢＝避けられない痛み、第二の矢＝反応が生む苦しみ', '体験の回避はさまざまな心理的問題と関連する', '受容で第二の矢を減らす'] },
{ id: '3-6', u: 2, th: '心理', t: '思考・感情・身体感覚のつながり', g: '体験を要素に分けて観察できる', b: [
  '強い感情に飲み込まれると、体験は1つの大きなかたまりに感じられます。マインドフルネスでは、それを[[思考・感情・身体感覚・行動への衝動]]に分けて観察します。',
  'たとえば、返信が来ない。思考「嫌われたかも」、感情は不安、身体は胸がざわつき肩に力が入る、衝動は何度もスマホを確認したくなる。この4つは互いに強め合います。',
  '要素に分けると、それぞれが[[変化し続ける一時的なもの]]だとわかり、巻き込まれにくくなります。特に身体感覚は「今ここ」にしかないので、注意の錨（いかり）として使えます。',
  '感情に名前をつける[[ラベリング]]も有効です。「不安がある」と言葉にすると、感情の渦の中から一歩外に出られます。2007年のリーバーマンらの研究では、感情を言葉にすると、否定的な画像に対する扁桃体の反応が弱まることが脳画像で示されました。'],
  p: ['体験を思考・感情・身体感覚・衝動に分ける', '4つは互いに強め合う', 'ラベリングで一歩外に出る'] },

{ id: '4-1', u: 3, th: '科学', t: 'デフォルト・モード・ネットワーク', g: 'DMNとマインドフルネスの関係を説明できる', b: [
  '何もしていないときにも、脳は活発にはたらいています。課題に取り組んでいないときに活動が高まる脳の領域のまとまりを[[デフォルト・モード・ネットワーク（DMN）]]といいます。2001年にレイクルらが「脳のデフォルト・モード」という考え方を示し、その後この名前で呼ばれるようになりました。',
  'DMNは、自分についての思考、過去の回想、未来の想像などに関わり、マインドワンダリングと関係が深いと考えられています。',
  '2011年、ブルワーらは、瞑想の経験が長い人では、未経験の人に比べて[[瞑想中にDMNの主要な部位（内側前頭前野と後帯状皮質）の活動が低い]]ことを報告しました。',
  'ただしDMNは悪者ではありません。記憶の整理や計画、他者の気持ちの想像にも必要です。過剰にはたらき続けて反すうにつながることが問題だと考えられています。'],
  p: ['DMN＝何もしていないときに活動が高まる脳のネットワーク', '自己についての思考やマインドワンダリングと関係', '瞑想経験者は未経験者より瞑想中の活動が低い（2011年）'] },
{ id: '4-2', u: 3, th: '科学', t: '脳は変わるのか', g: '脳構造の研究と、その再現性の問題を説明できる', b: [
  '経験によって脳が変化する性質を[[神経可塑性]]といいます。瞑想でも脳が変わるのではないか、という研究が2000年代に注目されました。',
  '2005年、ラザーらは瞑想経験者20人と未経験者15人を比べ、経験者では注意や体の感覚に関わる[[大脳皮質が厚い]]と報告。2011年にはヘルツェルらが、8週間のMBSRを受けた16人で、記憶や感情に関わる[[左の海馬の灰白質の密度が増えた]]と報告し、広く引用されました。',
  'しかし、これらは参加者が少ない研究でした。2022年、クラルらは218人を対象に、より厳密な方法（2つの無作為化比較試験の統合）で調べ、[[8週間のMBSRで脳の構造の変化は確認できなかった]]と報告しています。ただし著者らは、もっと長い訓練なら変化が起こる可能性は残るとしています。',
  '「8週間で脳が変わる」という言い方は、現時点では言い過ぎです。脳のはたらき方（機能）の変化を示す研究はありますが、構造の変化については結論が出ていません。'],
  p: ['2005年ラザー、2011年ヘルツェルの研究が有名', '2022年の大規模試験（218人）では構造変化を再現できず', '「8週間で脳が変わる」は言い過ぎ'] },
{ id: '4-3', u: 3, th: '科学', t: '効果のエビデンス', g: '何に、どの程度の効果が示されているかを説明できる', b: [

  '効果の大きさは小〜中程度（8週間時点の効果量は不安0.38、抑うつ0.30、痛み0.33）。一方で、他の積極的な治療（運動、薬、他の心理療法など）より[[優れているという証拠はなかった]]ことも同じ論文で示されています。',
  'うつ病の再発予防では、2016年にカイケンらが9つの試験（1,258人分のデータ）を統合し、MBCTを受けた人は受けなかった人より[[60週以内の再発リスクが約3割低い]]（ハザード比0.69）と報告しました。',

  p: ['不安・抑うつ・痛みに中程度のエビデンス（2014年）', '他の治療より優れているとはいえない', 'MBCTはうつ病の再発リスクを下げる（2016年）'] },
{ id: '4-4', u: 3, th: '科学', t: '研究の限界と有害事象', g: '研究の弱点と、起こりうる不調を説明できる', b: [
  '2018年、ヴァン・ダムら15人の研究者は論文[[「Mind the Hype（誇大宣伝に注意）」]]で、マインドフルネス研究の問題点を指摘しました。',
  '主な問題は、①研究によって「マインドフルネス」の定義がばらばら、②測定が本人の回答（質問紙）に頼っている、③研究の方法が弱いものが多い、④有害事象がきちんと調べられていない、の4つです。',
  '瞑想で[[不安の高まり、つらい記憶のよみがえり、現実感がなくなる感じ]]などが起こることがあります。2017年のリンダールらの研究は、瞑想に関連する体験を59種類に整理しました。2021年のブリトンらの研究（96人）では、8週間のプログラムで何らかの不快な体験をした人が58％、生活に支障が出た人が37％、悪い影響が長く続いた人が6〜14％でした。著者らは、この頻度は他の心理療法と同じ程度だとしています。',
  '多くは一時的で軽いものですが、ゼロではありません。「誰にでも安全で、やればやるほど良い」とは言えない、というのが現在の理解です。'],

{ id: '4-5', u: 3, th: '科学', t: 'マインドフルネスを測る', g: '代表的な尺度と5つの側面を説明できる', b: [
  'マインドフルネスは主に質問紙で測定します。代表的なものが2003年の[[MAAS]]で、「気づかないうちに物事をしている」などの項目から、日常での注意深さを測ります。',
  '2006年にベアらが作った[[FFMQ（5因子マインドフルネス質問紙）]]は、5つの側面に分けて測ります。①[[観察]]（感覚や感情に気づく）、②[[描写]]（体験を言葉にする）、③[[意識した行動]]（自動操縦でなく行動する）、④[[判断しない]]（体験を評価しない）、⑤[[反応しない]]（思考や感情に巻き込まれない）。',
  'この5側面は、自分の得意・不得意を知る手がかりになります。たとえば「観察」は得意でも「判断しない」が苦手、という人は少なくありません。',
  'ただし質問紙には限界があります。自分の不注意に気づける人ほど点数が低く出る、という指摘もあります（グロスマン、2008年）。',
  'そこで、行動で測る方法も使われます。呼吸を1から9まで数え続ける[[呼吸カウント課題]]（2014年、レビンソンら）、作業中にランダムな合図で「今、注意はどこにあったか」を尋ねる[[思考プローブ]]、数字が出るたびに押し、特定の数字のときだけ押さない[[持続的注意課題（SART）]]（1997年、ロバートソンら）などです。このノートの「心の実験室」で、短縮版を自分で体験できます。'],
  p: ['MAAS（2003年）とFFMQ（2006年）が代表的', '5側面＝観察・描写・意識した行動・判断しない・反応しない', '自己報告の限界を補うため、行動で測る課題もある'] },

{ id: '5-4', u: 4, th: '実践', t: '歩く瞑想・動きの瞑想', g: '動きながら行う実践の方法を説明できる', b: [

{ id: '5-7', u: 4, th: '実践', t: '思考と感情を観察する', g: '思考や感情を対象にした観察の方法を説明できる', b: [

{ id: '6-1', u: 5, th: '日常', t: 'STOPと3分間呼吸空間法', g: '2つの短い実践の手順を説明できる', b: [

{ id: '6-2', u: 5, th: '日常', t: 'RAIN：つらい感情への対応', g: 'RAINの4ステップを説明できる', b: [

  p: ['R認識する・A許す・I探る・Nいたわる', '消そうとせず、まずあることを許す', '感情＝自分そのものではない'] },

  '刺激と反応のあいだには間があり、その間に自分の対応を選ぶ自由がある、という考え方がよく引用されます。反射的な[[反応]]から、選んだ[[対応]]へ。これが人間関係での実践です。'],

  '[[緊張する場面の前]]：足の裏が床に触れている感覚に注意を向けます。地面とのつながりを感じる方法で、グラウンディングと呼ばれます。',

LESSONS = LESSONS.concat([
{ id: '7-1', u: 6, th: '仏教', t: 'サティの本来の意味をめぐる議論', g: '伝統的なサティと現代の定義の違いを説明できる', b: [
  'サティ（サンスクリット語でスムリティ）は、もともと[[「思い出す」「記憶する」]]という意味の語根から来ています。今していることを忘れずに心にとどめておく、というはたらきです。',
  '20世紀、ドイツ出身の上座部の僧[[ニャナポニカ・テーラ]]は、著書『仏教瞑想の心髄』（英語初版1954年）でサティを[[「ありのままの注意（bare attention）」]]と説明し、この言い方を広めました。評価や反応を加えず、起きていることだけを受け取る注意です。現代の「評価をせずに」という定義は、この説明の影響を強く受けています。',
  'これに対し2011年、学術誌『Contemporary Buddhism』の特集で、比丘ボーディ、ゲシン、ドレイファスらがこの理解を問い直しました。経典でのサティは、[[正知（サンパジャンニャ）]]と呼ばれる「はっきりと見きわめる理解」と組になっており、何が役に立ち何が害になるかを覚えておくはたらきも含む、という指摘です。',
  'つまり現代の定義は、伝統的なサティの一部（今への注意と、反応しない態度）を取り出して、誰でも使える形にしたものです。どちらが正しいかではなく、[[何が取り出され、何が省かれたか]]を知っておくと、理解が深まります。'],
  p: ['サティの語根は「思い出す」', '「ありのままの注意」はニャナポニカの説明', '伝統的には正知（見きわめ）と組になっている'] },
{ id: '7-2', u: 6, th: '仏教', t: '三相：無常・苦・無我', g: '観察瞑想が何を見ようとしているのかを説明できる', b: [
  '仏教でヴィパッサナー（観）が見きわめようとするのは、あらゆる体験に共通する3つの性質、[[三相]]です。',
  '[[無常（アニッチャ）]]：すべては変化し続ける。呼吸も、かゆみも、怒りも、生じては消えます。[[苦（ドゥッカ）]]：変化するものに「このままでいてほしい」「早く消えてほしい」としがみつくと、満たされなさが生じます。[[無我（アナッター）]]：思考や感情は条件によって起こる現象で、固定した「私」が思い通りに支配しているわけではありません。',
  '現代のプログラムは、これらを教義として教えることはしません。しかし実践の中では同じことを体験します。痛みを観察していると強さが刻々と変わること（無常）、「私はダメだ」という考えが自分そのものではなく浮かんだ出来事であること（[[脱中心化]]は無我の考え方と響き合います）。',
  '注意したいのは、これらは信じるべき主張ではなく、[[自分の体験で確かめる観察の視点]]として示されている点です。'],
  p: ['三相＝無常・苦・無我', '観察瞑想はこの3つを体験として確かめる', '脱中心化は無我の考え方と響き合う'] },
{ id: '7-3', u: 6, th: '仏教', t: '反応の連鎖：受から渇愛へ', g: '「受」と「渇愛」のあいだに気づきを入れる意味を説明できる', b: [
  '仏教は、苦しみが生じる過程を[[縁起]]という連鎖で説明します。その一部が、[[触（感覚の接触）→ 受（快・不快・どちらでもないという感じ）→ 渇愛（もっと欲しい／なくしたい）→ 取（しがみつき）]]です。',
  '[[受（ヴェーダナー）]]は感情ではなく、体験に最初につく「快・不快・中立」の色合いです。ここまでは自動的に起こります。問題は次の一歩で、快には「もっと」、不快には「嫌だ」という[[渇愛]]が続き、行動に駆り立てられます。',
  'マインドフルネスは、この受と渇愛のあいだに気づきを入れる練習と言えます。「不快がある」と気づくだけで、「なくしたい」という反応が自動的に続かなくなる余地が生まれます。四念処の2番目が「受」なのはこのためです。',
  '現代の研究者ブルワーは、これを習慣のループ（きっかけ→行動→報酬）と対応させ、渇望（クレービング）を観察する禁煙プログラムを開発しました。2011年の比較試験（88人）では、17週後に禁煙を続けていた人は、マインドフルネスの群で31％、標準的な禁煙プログラムの群で6％でした。'],
  p: ['触→受→渇愛→取という連鎖', '受＝快・不快・中立の色合い', '気づきを入れるのは受と渇愛のあいだ'] },
{ id: '7-4', u: 6, th: '仏教', t: '五蓋：実践を妨げる5つ', g: '五蓋を挙げ、それぞれへの対処を説明できる', b: [
  '瞑想がうまくいかないと感じるとき、起きていることはたいてい5種類に分けられます。伝統的に[[五蓋（ごがい）]]と呼ばれる、心を覆うものです。',
  '①[[欲（貪欲）]]：心地よいものを求めて注意が引っぱられる。②[[怒り（瞋恚）]]：不快なものへの抵抗、いら立ち、自己批判。③[[眠気・だるさ（惛沈睡眠）]]：心が重く沈む。④[[そわそわ・後悔（掉挙悪作）]]：落ち着かず、心配や後悔が次々に浮かぶ。⑤[[疑い（疑）]]：「意味があるのか」「自分には向いていない」という迷い。',
  '大事なのは、五蓋を敵として追い払うのではなく、[[それ自体を観察の対象にする]]ことです。「今、眠気がある」「疑いが浮かんでいる」と名前をつけると、巻き込まれずに済みます。',
  '補助的な対処もあります。欲には対象の変化（無常）を見る、怒りには慈悲の瞑想、眠気には目を開ける・姿勢を正す・立つ、そわそわには吐く息を長く感じる・体に注意を下ろす、疑いにはいったん脇に置いて決めた時間だけ続ける。'],
  p: ['五蓋＝欲・怒り・眠気・そわそわ・疑い', '追い払わず、名前をつけて観察する', 'それぞれに補助的な対処がある'] },
{ id: '7-5', u: 6, th: '仏教', t: '七覚支：育てる7つの要素', g: '七覚支を挙げ、バランスの考え方を説明できる', b: [
  '五蓋が妨げなら、育てていくものが[[七覚支（しちかくし）]]です。①[[念]]（気づき）、②[[択法]]（体験をよく調べること）、③[[精進]]（努力・エネルギー）、④[[喜]]（喜び）、⑤[[軽安]]（心身の落ち着き）、⑥[[定]]（集中）、⑦[[捨]]（平静さ）。',
  'この7つは2つのグループに分けられます。択法・精進・喜は心を[[活性化]]させる要素。軽安・定・捨は心を[[静める]]要素です。',
  '心が沈んで眠いときは、活性化の要素（興味を持って調べる、姿勢を正す）を強めます。心が高ぶって落ち着かないときは、静める要素（体をゆるめる、1点に集中する）を強めます。',
  'そして[[念はいつでも役に立つ]]とされます。今どちらに傾いているかに気づくはたらきだからです。現代の用語でいえば、覚醒水準を自分で調整する技術にあたります。'],
  p: ['七覚支＝念・択法・精進・喜・軽安・定・捨', '活性化の3つと、静める3つ', '念は両方のバランスを取る'] },
{ id: '7-6', u: 6, th: '仏教', t: '四無量心：慈・悲・喜・捨', g: '4つの心と「近い敵」を説明できる', b: [
  '慈悲の瞑想は、実は4つの心を育てる実践の一部です。まとめて[[四無量心（しむりょうしん）]]といいます。',
  '[[慈（メッター）]]：相手の幸せを願う心。[[悲（カルナー）]]：相手の苦しみがなくなることを願う心。[[喜（ムディター）]]：相手の喜びをともに喜ぶ心。[[捨（ウペッカー）]]：好き嫌いに偏らない平静な心。',
  '5世紀の注釈書『清浄道論』は、それぞれに正反対の「遠い敵」と、似ているが別物の[[「近い敵」]]があるとします。たとえば慈の遠い敵は怒り、近い敵は貪り（執着）です。現代の指導者はこれをわかりやすく言い換えて、慈には執着的な愛情、悲には相手を下に見る憐れみや一緒に沈み込む悲嘆、喜には浮かれた高揚、捨には無関心を、近い敵として挙げます。',
  'とくに[[捨と無関心の違い]]は重要です。マインドフルネスの「評価しない」「反応しない」は、冷たく距離を置くことではありません。関心と思いやりを保ったまま、巻き込まれない状態を指します。'],
  p: ['四無量心＝慈・悲・喜・捨', 'それぞれに似て非なる「近い敵」がある', '捨（平静）は無関心ではない'] },

{ id: '8-1', u: 7, th: '臨床', t: 'MBSRの8週間をのぞく', g: 'MBSRがどのような流れで進むかを説明できる', b: [
  'MBSRは、週ごとにテーマと練習が積み上がる構成です（以下は公式カリキュラムのおおまかな流れです）。毎回、実践→体験の分かち合い（インクワイアリー）→テーマの話→自宅練習の確認、という流れで進みます。',
  '[[前半（第1〜3週）]]は体と知覚。レーズン・エクササイズとボディスキャンから始め、静坐瞑想とマインドフル・ヨーガを加えます。第2週に心地よい出来事、第3週に不快な出来事を1日1つ記録する[[出来事日誌]]が課され、体験を思考・感情・身体感覚に分ける練習をします。第2週のテーマは「知覚と創造的な対応」、第3週は「今ここにいることの喜びと力」です。',
  '[[中盤（第4〜5週）]]はストレス。自動的なストレス反応に気づき、反応ではなく対応を選ぶことを学びます。',
  '[[後半（第6〜8週）]]は対人関係と生活。難しいコミュニケーション、何を取り入れて暮らすかの選択を扱います。第6週と第7週のあいだに丸1日（約7時間半）の沈黙の実践があり、最終週は、ここまでの勢いを保ちながら自分の続け方を決めます。'],
  p: ['実践→分かち合い→テーマ→自宅練習の流れ', '前半は体と知覚、中盤はストレス、後半は対人関係と生活', '出来事日誌で体験を要素に分ける'] },
{ id: '8-2', u: 7, th: '臨床', t: 'MBCTの8セッション', g: 'MBCTの各セッションのテーマを説明できる', b: [
  'MBCTは8回のセッションにそれぞれ題がついています。前半は注意の向け方を学び、後半は難しい体験との関わり方を学びます。',
  '第1回[[気づきと自動操縦]]。第2回[[頭の中で生きる]]（体験を直接感じることと、考えることの違い）。第3回[[散らばった心をまとめる]]（呼吸と体を錨にする。3分間呼吸空間法を導入）。第4回[[嫌悪に気づく]]（不快なものを避けようとする反応を知る）。',
  '第5回[[そのままにしておく]]（つらい体験を変えようとせず、あることを許す）。第6回[[思考は事実ではない]]。第6回と第7回のあいだには1日の実践が置かれます。第7回[[どうすれば自分を大切にできるか]]（気分を支える活動と消耗させる活動を見直し、再発のサインへの行動計画を作る）。第8回[[学びを続け、広げる]]。',
  'MBSRとの大きな違いは、うつの再発のしくみ（気分の落ち込みが否定的な思考パターンを呼び起こす）を明確に教えることと、再発の早期サインに備える行動計画を作ることです。'],
  p: ['前半は注意、後半は難しい体験との関わり方', '第4回「嫌悪」、第6回「思考は事実ではない」', '再発のサインへの行動計画を作る'] },
{ id: '8-3', u: 7, th: '臨床', t: 'DBTのマインドフルネス・スキル', g: '賢い心と、whatスキル・howスキルを説明できる', b: [
  '弁証法的行動療法（DBT）では、瞑想の時間を長く取る代わりに、マインドフルネスを日常で使う[[スキル]]として教えます。4つのスキル群（マインドフルネス、苦悩耐性、感情調節、対人関係）の土台にあたります。',
  '中心にあるのが[[賢い心（ワイズ・マインド）]]。感情に支配された「感情的な心」と、理屈だけで考える「理性的な心」の両方を統合した状態です。',
  '[[whatスキル（何をするか）]]は3つ。観察する（言葉をつけずに気づく）、描写する（事実を言葉にする）、参加する（今していることに完全に入り込む）。',
  '[[howスキル（どのようにするか）]]も3つ。判断せずに（良い悪いをつけず事実を見る）、ひとつのことに集中して、効果的に（正しさにこだわらず、うまくいくことをする）。「効果的に」が入っている点が、DBTの実用的な特徴です。'],
  p: ['賢い心＝感情的な心と理性的な心の統合', 'what＝観察・描写・参加', 'how＝判断せずに・ひとつのことに・効果的に'] },
{ id: '8-4', u: 7, th: '臨床', t: 'ACTの6つのプロセス', g: '心理的柔軟性を構成する6つのプロセスを説明できる', b: [
  'ACTが目指すのは症状をなくすことではなく、[[心理的柔軟性]]。つらい思考や感情があっても、自分の大切なことに向かって行動できる力です。6つのプロセスで構成され、六角形の図（ヘキサフレックス）で示されます。',
  '①[[アクセプタンス]]：不快な体験を避けずに、そのための場所を空ける。②[[脱フュージョン]]：思考と一体化せず、思考を思考として眺める（「私はダメだ」→「『私はダメだ』という考えを持っている」）。',
  '③[[今この瞬間との接触]]：今の体験に注意を向ける。④[[文脈としての自己]]：思考や感情を観察している視点としての自分に気づく。この4つがマインドフルネスにあたる部分です。',
  '⑤[[価値]]：どう生きたいか、何を大切にしたいか。⑥[[コミットされた行為]]：価値に沿った具体的な行動を続ける。ACTでは、マインドフルネスは目的ではなく、価値に沿って生きるための手段と位置づけられます。'],
  p: ['目標は心理的柔軟性', 'アクセプタンス・脱フュージョン・今この瞬間・文脈としての自己', '価値とコミットされた行為のためにマインドフルネスを使う'] },
{ id: '8-5', u: 7, th: '臨床', t: 'なぜ効くのか：作用メカニズム', g: '提案されている主なメカニズムを説明できる', b: [
  '2011年、ヘルツェルらは、マインドフルネス瞑想がはたらくしくみを4つにまとめました。①[[注意の調整]]、②[[身体への気づき]]、③[[感情の調整]]（捉え直し、および不快な体験にとどまることで反応が弱まること）、④[[自己についての見方の変化]]。',
  '2017年のリンジーとクレスウェルの[[モニタリングと受容の理論（MAT）]]は、もっと絞り込みます。今の体験を観察する力（モニタリング）は認知機能を高めるが、感情も強く感じさせる。ストレスや気分への効果には、それを[[受け入れる態度（受容）]]が欠かせない、という理論です。',
  'MBCTについては、プログラムによる[[マインドフルネス、反すう、心配、セルフ・コンパッションなどの変化]]が、その後の改善と関連していたという報告があります。2015年のレビューでは、23の研究のうち12でこうした関連が見られました。',
  'ただし、どのメカニズムも決定的に証明されたわけではありません。「何が効いているのか」は、今も研究が続いている問いです。'],
  p: ['4つのしくみ＝注意・身体・感情・自己観', 'MAT＝モニタリングだけでなく受容が鍵', 'メカニズムはまだ研究途上'] },
{ id: '8-6', u: 7, th: '臨床', t: 'どれくらい練習すればよいか', g: '練習量と効果の関係についてわかっていることを説明できる', b: [
  'MBSRやMBCTは1日45分ほどの自宅練習を求めますが、実際に参加者はどのくらい行っているのでしょうか。2017年、パーソンズらは複数の研究をまとめ、[[参加者は課された練習のおよそ6割（64％、1日約30分）を行っている]]と報告しました（43研究）。',
  '同じ分析で、[[練習量が多い人ほど改善が大きい]]という関連も示されました。ただし関連は小さく（相関0.26、28研究）、練習すればするほど比例して良くなる、というほど単純ではありません。',
  '短い練習の研究もあります。初心者が1日13分の誘導瞑想を続けたところ、4週間では差がなく、8週間で気分や注意が改善した、という2019年の報告があります。',
  '現時点で言えるのは、「最適な時間」は確立していないこと、長さより[[続けること]]が大切らしいこと、そして無理に長くして苦痛が増すなら短くしてよい、ということです。'],
  p: ['参加者は課された練習の約6割を行っている', '練習量と改善には小さいが確かな関連', '最適な時間は確立していない'] },
{ id: '8-7', u: 7, th: '臨床', t: '痛みと依存への応用', g: '痛み・依存の分野での主な研究結果を説明できる', b: [
  '[[痛み]]はマインドフルネスが最初に使われた分野です。2016年、チャーキンらは慢性の腰痛がある342人を、MBSR、認知行動療法、通常のケアに分けて比べました。半年後に生活機能がはっきり改善した人は、MBSRで60.5％、認知行動療法で57.7％、通常のケアで44.1％。[[MBSRと認知行動療法はどちらも通常のケアより改善した人が多く、両者はほぼ同じでした。]]',
  '実験研究では、ザイダンらが4日間の訓練（15人）で、瞑想中は安静時に比べて実験的な痛みの不快さが57％、強さが40％下がることを示し（2011年）、その効果は体内のオピオイド（鎮痛物質）とは別のしくみによることを報告しています。痛みそのものと、痛みへの反応（第二の矢）を分けるという考え方に合う結果です。',
  '[[依存]]の分野では、再発予防にマインドフルネスを組み合わせた[[MBRP（マインドフルネスに基づく再発予防）]]があります。渇望を波のように観察してやり過ごす[[衝動サーフィン]]が代表的な技法です。',
  '2014年のボーウェンらの試験（286人）では、6か月時点ではMBRPと認知行動的な再発予防がともに通常の治療より良く、12か月の時点では、MBRPを受けた人は他の群より薬物使用日数や大量飲酒が少なかったと報告されています。'],
  p: ['慢性腰痛：MBSRと認知行動療法は同程度に有効（2016年）', '痛みの軽減はオピオイドとは別のしくみ', '依存にはMBRPと衝動サーフィン'] },
{ id: '8-8', u: 7, th: '臨床', t: '大規模試験が示した現在地', g: '「誰にでも効く」とは言えない根拠を説明できる', b: [
  '学校でのマインドフルネス教育は急速に広がりましたが、2022年、イギリスの大規模試験[[MYRIAD（マイリアド）]]が慎重な結果を出しました。',
  '85校・11〜14歳の生徒8,376人を対象に、学校の授業としてマインドフルネスを教えた群と、通常の授業を受けた群を比べたところ、1年後の時点で、[[マインドフルネスの授業のほうが心の健康に良いという証拠は得られませんでした。]]',
  'この結果は「マインドフルネスは効かない」という意味ではありません。[[希望していない人に一律に教える]]やり方では効果が出にくい、ということです。自分から取り組む大人のプログラムとは条件が違います。',
  '2022年には、44のメタ分析（336の比較試験）をまとめた総説も出ています。何もしない場合と比べれば効果があり、他の積極的な介入と比べると差は小さく、確立された治療と比べると同程度、というのが全体像です。[[期待しすぎず、選択肢の1つとして使う]]のが、現在の根拠に合った姿勢です。'],
  p: ['MYRIAD試験：学校での一律の授業では差が出なかった', '自分から取り組む場合とは条件が違う', '確立された治療と同程度、が全体像'] },

{ id: '9-1', u: 8, th: '深化', t: 'つまずき①：眠気とそわそわ', g: '眠気と落ち着かなさへの対処を選べる', b: [
  '[[眠気]]はもっとも多いつまずきです。まず、単に睡眠不足ではないかを確かめます。そうであれば、必要なのは瞑想より睡眠です。',
  '実践中の対処：目を開けて斜め下を見る。背すじを伸ばす。立って行う、歩く瞑想に切り替える。時間帯を食後や就寝前から朝に変える。そして、眠気そのものを観察します。まぶたの重さ、頭がぼんやりする感じ、落ちていく瞬間。',
  '[[そわそわ・落ち着かなさ]]は反対の状態です。対処：体のどこにそわそわがあるかを探す。足の裏やお尻など、下のほうの感覚に注意を下ろす。吐く息の最後まで感じる。それでも強ければ、歩く瞑想やヨーガなど動きのある実践にします。',
  'どちらの場合も、[[「うまくいっていない」という判断こそが上乗せの苦しみ]]です。眠い瞑想も、落ち着かない瞑想も、気づいていれば実践として成立しています。七覚支でいえば、眠気には活性化、そわそわには静める要素を足します。'],
  p: ['眠気：目を開ける・姿勢・立つ・時間帯を変える', 'そわそわ：下半身の感覚、吐く息、動く実践', '状態を判断せず、それ自体を観察する'] },
{ id: '9-2', u: 8, th: '深化', t: 'つまずき②：痛み・退屈・疑い', g: '痛み、退屈、疑いへの対処を選べる', b: [
  '[[体の痛み]]：まず、動かしてよい痛みか、けがにつながる痛みかを区別します。後者ならすぐに姿勢を変えます。前者の場合は、すぐに動かず数呼吸だけ観察してみます。場所、広さ、質（ズキズキ、重い、熱い）、強さの変化。そのうえで、[[意図的に、ゆっくり姿勢を変える]]。動くことは失敗ではなく、自動的に動かないことが練習です。',
  '[[退屈]]：退屈は「もっと面白い刺激がほしい」という欲の一種です。退屈を体のどこで感じるかを観察し、呼吸の細部（吸う息と吐く息の温度の違い、切り替わる瞬間）に興味を向け直します。',
  '[[疑い]]：「自分には向いていない」「意味があるのか」。これは考えの1つとしてラベルを貼り（「疑い」）、決めた時間が終わるまで保留にします。続けるかどうかの判断は、実践の最中ではなく、落ち着いているときに行います。',
  '疑いが続くなら、それは正当な問いかもしれません。方法が合っていない、時間が長すぎる、今は時期ではない。[[やめる、変える、も選択肢]]です。'],
  p: ['痛み：観察してから、意図的に動く', '退屈と疑いは、名前をつけて観察する', 'やめる・変えるも正当な選択'] },
{ id: '9-3', u: 8, th: '深化', t: '観察を細かくする：ノーティング', g: 'ノーティングの方法と、受の観察を説明できる', b: [
  'ラベリングをさらに体系的にしたのが、ミャンマーのマハーシ・サヤドーが広めた[[ノーティング]]です。お腹の動きを「膨らみ」「縮み」と心の中で確認し続け、ほかのものが現れたら「聞こえている」「考えている」「かゆみ」と確認して、またお腹に戻ります。',
  'コツは3つ。言葉は短く単純に。注意の大半は感覚そのものに置き、言葉は添える程度にする。内容ではなく[[プロセス]]を確認する（「明日の会議のこと」ではなく「計画している」）。',
  'もう一歩進めるなら、[[受（快・不快・どちらでもない）]]を確認します。音が聞こえたら「不快」。暖かさを感じたら「快」。呼吸は多くの場合「どちらでもない」。',
  'これを続けると、不快に対して体がこわばる、快に対して「もっと」と前のめりになる、[[受の直後に起こる小さな反応]]が見えてきます。7-3で学んだ連鎖を、自分の体験で確かめる練習です。実践タイマーの「受の観察」で試せます。'],
  p: ['ノーティング＝短い言葉で体験を確認し続ける', '内容ではなくプロセスに名前をつける', '快・不快・中立と、直後の反応を観察する'] },
{ id: '9-4', u: 8, th: '深化', t: '選ばない気づき', g: '開かれた観察の進め方を説明できる', b: [
  '集中が安定してきたら、注意の対象を決めない実践に進めます。[[選択なき気づき（チョイスレス・アウェアネス）]]、あるいは開かれた観察と呼ばれ、MBSRの静坐瞑想の最後の段階にあたります。',
  '進め方：まず呼吸で注意を安定させる。次に体全体へ広げる。さらに音へ、思考へ、感情へと広げる。最後に、[[何か1つを選ぶことをやめ]]、その瞬間にいちばんはっきりしているものに、ただ気づいています。',
  'たとえとして、空と天気が使われます。音も思考も感覚も、空に現れては消える雲や風。自分は天気ではなく、それが起こる[[空のような広がり]]として座ります。',
  '難しさは、ぼんやりしているだけなのか、開かれて気づいているのかの区別がつきにくいこと。迷ったら呼吸に戻ります。[[集中の錨に戻れることが、開かれた観察の安全装置]]です。実践タイマーの「開かれた観察」で試せます。'],
  p: ['対象を決めず、現れるものに気づいている', '呼吸→体→音→思考→選ばない、の順に広げる', '迷ったら呼吸の錨に戻る'] },
{ id: '9-5', u: 8, th: '深化', t: 'リトリートと指導者', g: '集中的な実践の場と、指導者を選ぶ視点を説明できる', b: [
  '[[リトリート]]は、日常を離れて数日から数週間、集中的に実践する場です。多くは沈黙で行われ、座る瞑想と歩く瞑想を交互に、1日に何時間も続けます。',
  '深い体験が得られる一方、負担も大きくなります。つらい感情や記憶が強く出ることがあり、有害事象の報告も集中的な実践に多い傾向があります。精神的な不調があるとき、初めての人がいきなり長期のものに参加することは勧められません。',
  '[[指導者を選ぶ視点]]：①自分自身が長く実践しているか。②MBSRやMBCTの場合、正式な指導者養成の課程を経ているか（指導の質を評価する基準として[[MBI:TAC]]が使われます）。③つらくなったときの対応や、参加を見合わせたほうがよい場合について事前に説明があるか。④効果を誇張していないか。',
  'トラウマ体験がある人への配慮をまとめた[[トラウマ・センシティブ・マインドフルネス]]という考え方もあります。目を開けてよい、注意の対象を自分で選べる、いつでもやめてよい、という選択肢を常に示すことが基本です。'],
  p: ['リトリート＝沈黙の集中実践。負担も大きい', '指導者の訓練歴と、リスクの説明があるかを確かめる', 'トラウマに配慮した進め方がある'] },
{ id: '9-6', u: 8, th: '深化', t: '倫理という土台', g: 'マインドフルネスと倫理の関係をめぐる議論を説明できる', b: [
  '仏教の伝統では、瞑想は単独の技術ではありません。八正道は[[戒（倫理的な行い）・定（心の集中）・慧（智慧）]]の3つに分けられ、正念は定のグループに入ります。行いを整えることが、心を静める前提とされてきました。',
  'ここから、現代のマインドフルネスへの問いが生まれます。倫理から切り離された注意の訓練は、何に使われてもよいのか。集中力を高めて人を傷つけることも「マインドフル」なのか。伝統的には、害をなす注意は[[邪念（誤った念）]]とされ、正念とは区別されます。',
  'これに対してカバットジンらは、倫理は明示的に教えなくても、評価しない態度、思いやり、指導者の姿勢の中に[[暗黙に含まれている]]と答えています。',
  '結論は出ていません。ただ、学ぶ側にとっての実用的な問いは残ります。[[自分は何のために実践するのか。]]1-2で学んだ「意図」は、この問いへの入り口です。'],
  p: ['伝統では戒・定・慧がセット', '倫理なき注意訓練への批判がある', '「何のために」という意図が問われる'] },
{ id: '9-7', u: 8, th: '深化', t: '自分の実践計画をつくる', g: '自分に合った実践計画を立てられる', b: [
  'ここまで学んだことを、自分用の計画にまとめます。決めることは5つです。',
  '①[[目的]]：何のために行うか（ストレス、集中、自分を責める癖、探究心）。②[[中心になる実践]]を1つ：呼吸瞑想、ボディスキャン、歩く瞑想から選ぶ。③[[時間ときっかけ]]：「朝のコーヒーの前に5分」のように、すでにある習慣に結びつける。',
  '④[[日常の実践]]を1つ：歯みがき、皿洗い、最初のひと口。そして困ったとき用の短い実践（STOP、3分間呼吸空間法）。⑤[[つまずいたときの方針]]：眠いときは立つ、つらいときはやめる、3日あいたら責めずに再開する。',
  '2〜4週間続けたら、心の実験室で同じ測定をもう一度行い、心のデータで変化を見ます。数字が良くなることが目的ではありません。[[自分の心の傾向を知り、実践を調整する材料]]にします。記述演習の最後の問いで、計画を文章にしてみましょう。'],
  p: ['目的・中心の実践・時間ときっかけ・日常の実践・つまずきの方針', '2〜4週間ごとに測定して調整する', '数字は目的ではなく材料'] }

  if (d.opt) { S.opt[d.opt] = S.opt[d.opt] ? 0 : 1; save(); t.classList.toggle('on', !!S.opt[d.opt]); if (S.opt[d.opt]) { if (d.opt === 'bell') bell(); else say('音声ガイドをオンにしました'); } return; }
  if (d.rep !== undefined) { if (sit.on) { sit.n++; vib(20); $('reps').textContent = '気づき ' + sit.n + '回'; } return; }
  if (d.exmin) { ui.exmin = +d.exmin; document.querySelectorAll('[data-exmin]').forEach(function (b) { b.classList.toggle('on', b === t); }); return; }
  if (d.exstart) return startExp(d.exstart);
  if (d.bc) { if (d.bc === 'b') X.n++; else if (d.bc === '9') { if (X.n === 8) X.ok++; else X.ng++; X.n = 0; } else { X.rs++; X.n = 0; } vib(15); return; }
  if (d.pr) { X.c[d.pr]++; clearTimeout(X.wait); X.idle(); X.sched(); return; }
  if (d.sa !== undefined) { if (X.cur && !X.cur.hit) { X.cur.hit = true; X.cur.rt = Date.now() - X.cur.t; } return; }
  if (d.lb) { X.c[d.lb] = (X.c[d.lb] || 0) + 1; t.querySelector('small').textContent = X.c[d.lb]; vib(15); return; }
  if (d.fq) { ui.fa[+d.fq] = +d.fv; t.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === t); }); return; }
  if (d.fsubmit !== undefined) {
    var miss = FQ.map(function (q, i) { return ui.fa[i] ? 0 : i + 1; }).filter(Boolean);
    if (miss.length) { $('fmsg').textContent = '未回答：' + miss.join('、') + '問目'; return; }
    var sc = [0, 0, 0, 0, 0]; FQ.forEach(function (q, i) { sc[q[0]] += (q[2] ? 6 - ui.fa[i] : ui.fa[i]) / 3; });
    $('intro').style.display = 'none'; return finishExp('facet', { s: sc });
  }
  if (d.prog) { if (t.checked) S.prog[d.prog] = 1; else delete S.prog[d.prog]; save(); return; }
  if (d.back !== undefined) { if (history.length > 1 && render.last) history.back(); else go('home'); return; }
  if (d.set) { ui[d.set] = d.set === 'qn' ? +d.val : d.val; return render(); }
  if (d.theme) { ui.theme = d.theme; return render(); }
  if (d.era) { ui.era = d.era; return render(); }
  if (d.qcat) { ui.qcat = d.qcat; return render(); }
  if (d.gcat) { ui.gcat = d.gcat; return render(); }
  if (d.done) { if (S.done[d.done]) delete S.done[d.done]; else S.done[d.done] = 1; save(); return render(); }
  if (d.mark) { if (S.mark[d.mark]) delete S.mark[d.mark]; else S.mark[d.mark] = 1; save(); return render(); }
  if (d.term) { var g = glossByTerm(d.term); document.getElementById('term-pop').innerHTML = '<div class="ans"><b style="font-size:16px">' + esc(g[0]) + '</b>' + esc(g[3]) + '</div>'; return; }
  if (d.node !== undefined) return t.classList.toggle('on');
  if (d.ev !== undefined) return t.classList.toggle('on');
  if (d.lq) {
    var l = lessonById(d.lq), text = l.b.join(''), rel = GLOSS.filter(function (x) { return x[0].length > 1 && text.indexOf(x[0]) >= 0; });
    var cat = { '理論': '基礎', '歴史': '歴史', '心理': '心理', '科学': '科学', '実践': '実践', '日常': '応用', '仏教': '仏教', '臨床': '臨床', '深化': '仏教' }[l.th];
    rel = shuffle(rel).concat(shuffle(GLOSS.filter(function (x) { return x[2] === cat && rel.indexOf(x) < 0; })));
    return startQuiz('確認問題 ' + l.id, rel.slice(0, 5).map(function (x) { return makeChoice(x, GLOSS, false); }), false, 'lesson/' + l.id);
  }
  if (d.startqa !== undefined) {
    var pool = GLOSS.filter(function (x) { return ui.qcat === 'すべて' || x[2] === ui.qcat; });
    var pick = shuffle(pool).sort(function (a, b) { return (S.known[a[0]] ? 1 : 0) - (S.known[b[0]] ? 1 : 0); }).slice(0, ui.qn);
    if (ui.qmode === '正誤') return startQuiz('正誤判定', shuffle(TF).slice(0, ui.qn).map(function (x) { return { q: x[0], o: ['○ 正しい', '× 誤り'], a: x[1] ? 0 : 1, ex: x[2] }; }), false, 'qa');
    var flip = ui.qmode === 'めくる';
    return startQuiz('一問一答', shuffle(pick).map(function (x) { return flip ? { q: x[3], term: x[0] } : makeChoice(x, pool, ui.qmode === '逆引き'); }), flip, 'qa');
  }
  if (d.weakquiz !== undefined) return startQuiz('苦手な用語', shuffle(Object.keys(S.weak).map(glossByTerm).filter(Boolean)).map(function (x) { return makeChoice(x, GLOSS, false); }), false, 'review');
  if (d.yearquiz !== undefined) {
    var evs = TIMELINE.filter(function (x) { return x[5]; }), years = evs.map(function (x) { return x[0]; }).filter(function (y, i, a) { return a.indexOf(y) === i; });
    return startQuiz('年代クイズ', shuffle(evs).slice(0, 10).map(function (x) {
      var near = years.filter(function (y) { return y !== x[0]; }).sort(function (a, b) { return Math.abs(parseInt(a) - x[1]) - Math.abs(parseInt(b) - x[1]); }).slice(0, 5);
      var o = shuffle([x[0]].concat(shuffle(near).slice(0, 3)));
      return { q: x[3] + '　これは何年？', o: o, a: o.indexOf(x[0]), ex: x[0] + '。' + x[4] };
    }), false, 'timeline');
  }
  if (d.reveal !== undefined) { quiz.shown = true; return render(); }
  if (d.flip) { grade(quiz.qs[quiz.i], d.flip === '1'); quiz.i++; quiz.shown = false; return render(); }
  if (d.pick) { quiz.picked = +d.pick; grade(quiz.qs[quiz.i], quiz.picked === quiz.qs[quiz.i].a); return render(); }
  if (d.nextq !== undefined) { quiz.i++; quiz.picked = -1; return render(); }
  if (d.essayShow) { var i = d.essayShow, s = S.essay[i] || { c: [] }; s.t = document.getElementById('essay-in').value; s.open = 1; S.essay[i] = s; save(); document.getElementById('essay-ans').style.display = ''; document.getElementById('essay-ans').scrollIntoView({ behavior: 'smooth' }); return; }
  if (d.essayChk) { var s2 = S.essay[d.essayChk] || { t: '', c: [], open: 1 }; s2.c[+d.j] = t.checked; S.essay[d.essayChk] = s2; save(); return; }
  if (d.min) { if (sit.on) sitStop(false); sit.min = +d.min; document.querySelectorAll('[data-min]').forEach(function (b) { b.classList.toggle('on', b === t); }); document.getElementById('left').textContent = fmt(sit.min * 60); return; }
  if (d.sit !== undefined) { if (sit.on) sitStop(false); else sitStart(); return; }
  if (d.reset !== undefined) { if (confirm('学習の記録（講義、用語、記述演習、実践、実験室、プログラム）をすべて消します。元に戻せません。よろしいですか？')) { S = blank(); save(); render(); } return; }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-mnode]')) { e.preventDefault(); e.target.closest('[data-mnode]').dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { ui.q = e.target.value; document.getElementById('results').innerHTML = searchResults(); }
  if (e.target.id === 'essay-in') document.getElementById('cnt').textContent = e.target.value.length;
});
render();
})();
</script>
