<style>

  .item .st { font-size: 13px; color: var(--ok); flex: 0 0 auto; }
  .unit-h { padding: 14px 16px; border-bottom: 1px solid var(--line); background: #0B1120; }

  .row { display: flex; gap: 8px; margin-top: 10px; } .row .btn { flex: 1; }

  .node { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }

  .node .n { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .node b { font-size: 16px; } .node div p { color: var(--soft); font-size: 14px; display: none; margin-top: 4px; }
  .node.on div p { display: block; }
  .flow { text-align: center; color: var(--dim); font-size: 16px; line-height: 1.6; }

  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .ev { position: relative; width: 100%; text-align: left; background: none; border: none; padding: 0 0 18px; display: block; }
  .ev::before { content: ''; position: absolute; left: -21px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .ev .y { color: var(--accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .ev .t { font-size: 16px; font-weight: 700; line-height: 1.5; }
  .ev .d { color: var(--soft); font-size: 14px; display: none; margin-top: 2px; }
  .ev.on .d { display: block; }

  .qhead { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
  .qtext { font-size: 17px; font-weight: 700; line-height: 1.7; margin: 10px 0 16px; }
  .opt { display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 15px; line-height: 1.6; }
  .opt.right { border-color: var(--ok); background: #123226; } .opt.wrong { border-color: var(--ng); background: #3A1D1E; }
  .ans { background: var(--card2); border-radius: 14px; padding: 14px; margin: 10px 0; font-size: 15px; }
  .ans b { color: var(--mark); font-size: 19px; display: block; }
  .big { font-size: 46px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .center { text-align: center; }

  textarea, input[type=search] { width: 100%; background: #0A101D; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; font-size: 16px; line-height: 1.7; outline: none; }
  textarea { min-height: 150px; resize: vertical; }
  textarea:focus, input:focus { border-color: var(--line2); }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 14.5px; }
  .chk input { width: 20px; height: 20px; margin-top: 4px; accent-color: #8DBBFF; flex: 0 0 auto; }

  .stage { height: 250px; display: flex; align-items: center; justify-content: center; }
  .circle { width: 112px; height: 112px; border-radius: 50%; background: var(--accent-bg); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; color: var(--accent); transition: transform 4s ease-in-out; padding: 8px; }
  .circle.in { transform: scale(1.9); transition-duration: 4s; } .circle.out { transform: scale(1); transition-duration: 6s; }
  .guide { min-height: 84px; text-align: center; font-size: 16px; color: var(--ink); padding: 0 6px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .stat b { font-size: 26px; font-weight: 800; display: block; line-height: 1.3; } .stat span { font-size: 12.5px; color: var(--soft); }
  .gl { padding: 14px 16px; border-bottom: 1px solid var(--line); } .gl:last-child { border-bottom: none; }
  .gl b { font-size: 16px; } .gl small { color: var(--dim); margin-left: 8px; } .gl p { color: var(--soft); font-size: 14px; }
  .tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--line2); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; }
  .empty { color: var(--dim); text-align: center; padding: 22px 0; font-size: 14px; }

  .tap { height: 128px; font-size: 30px; border-radius: 24px; line-height: 1.3; }
  .tap small { display: block; font-size: 13px; font-weight: 500; opacity: .8; }
  .digit { font-size: 104px; font-weight: 800; text-align: center; height: 170px; line-height: 170px; font-variant-numeric: tabular-nums; }
  .lbgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .lbgrid .btn { padding: 18px 8px; } .lbgrid .btn small { display: block; font-weight: 500; opacity: .75; font-size: 12px; }
  .hb { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 7px 0; }
  .hb span { flex: 0 0 104px; line-height: 1.4; color: var(--soft); } .hb div { flex: 1; background: #0A1222; border-radius: 5px; overflow: hidden; }
  .hb i { display: block; height: 10px; background: var(--accent); border-radius: 5px; min-width: 2px; } .hb em { font-style: normal; flex: 0 0 34px; text-align: right; color: var(--soft); }
  .days { display: flex; align-items: flex-end; gap: 4px; height: 84px; margin-top: 10px; }
  .days i { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; opacity: .9; } .days i.z { background: var(--line); }
  .scale { display: flex; gap: 6px; margin: 8px 0 4px; }
  .scale button { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: #0A101D; font-size: 15px; color: var(--soft); }
  .scale button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .scale-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
  .fq { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; } .fq:last-of-type { border-bottom: none; }
  .res b.n { font-size: 40px; font-weight: 800; display: block; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .res p { color: var(--soft); font-size: 14px; margin-top: 6px; }
  svg.chart { display: block; width: 100%; height: auto; }
  .prog-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .prog-item:last-child { border-bottom: none; }
  .prog-item input { width: 22px; height: 22px; accent-color: #8DBBFF; flex: 0 0 auto; }
  .prog-item button { flex: 1; text-align: left; background: none; border: none; font-size: 15px; line-height: 1.5; }
  .prog-item small { display: block; color: var(--dim); font-size: 12px; }
  button.circle { font-family: inherit; }
  nav#nav { position: fixed; left: 0; right: 0; bottom: 0; background: #0F172A; border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 10; }
  nav#nav div { max-width: 640px; margin: 0 auto; display: flex; gap: 6px; }
  nav#nav button { flex: 1; background: none; border: none; border-radius: 14px; padding: 9px 4px 7px; color: var(--soft); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav#nav button.on { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
  nav#nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { color: var(--dim); font-size: 12px; margin-top: 26px; line-height: 1.8; }
  footer a { color: var(--soft); }
</style>
</head>

<script>
(function () {
'use strict';

/* ================= データ ================= */
var UNITS = [
  ['第1章 基礎', 'マインドフルネスとは何か'],
  ['第2章 歴史', '仏教の瞑想から現代のプログラムへ'],
  ['第3章 心のしくみ', '注意・思考・感情の心理学'],
  ['第4章 脳と科学', '研究でわかったこと、わかっていないこと'],
  ['第5章 実践', '基本の瞑想を身につける'],
  ['第6章 日常と応用', '暮らしの中で使い、安全に続ける']
];
var THEMES = ['理論', '歴史', '心理', '科学', '実践', '日常'];

/* [[ ]] は重要語句 */
var LESSONS = [
{ id: '1-1', u: 0, th: '理論', t: '定義：今この瞬間への気づき', g: '定義を自分の言葉で説明できる', b: [
  '現代でもっとも広く使われる定義は、ジョン・カバットジンによる[[「意図的に、今この瞬間に、評価をせずに注意を向けることで生まれる気づき」]]です。',
  '3つの要素に分けて覚えます。①意図的に（たまたまではなく、自分で注意を向ける）、②今この瞬間に（過去の後悔や未来の心配ではなく、今起きていること）、③評価をせずに（良い・悪い、好き・嫌いの判定をいったん脇に置く）。',
  '「マインドフルネス」という言葉は3つの意味で使われます。今まさに気づいている[[状態]]、ふだんから気づきやすいという[[特性]]、そしてそれを育てる[[実践（練習）]]です。会話や文章でどの意味かを区別すると混乱が減ります。',
  '反対の状態は、心ここにあらずの「マインドレス」。体は動いているのに心が別の場所にある[[自動操縦]]の状態です。'],
  p: ['定義は「意図的に・今この瞬間に・評価をせずに」の3点', '状態・特性・実践の3つの意味がある', '反対は自動操縦（マインドレス）'] },
{ id: '1-2', u: 0, th: '理論', t: '2つの柱：注意と態度', g: '注意の調整と受容的な態度の両方が必要な理由を説明できる', b: [
  '2004年、ビショップらの研究グループはマインドフルネスを2つの要素で定義しました。1つ目は[[注意の自己調整]]。注意を今の体験に保ち、それたら戻すはたらきです。',
  '2つ目は[[体験への態度]]。浮かんでくるものに対して、好奇心を持ち、開かれていて、受け入れる姿勢です。',
  '注意だけを鍛えると、不快な体験を「集中の邪魔」として押さえ込む練習になりがちです。逆に態度だけでは、何に気づいているのかがぼやけます。[[集中力のトレーニングと、体験へのやさしい向き合い方はセット]]です。',
  'シャピロらはこれに「意図（なぜ実践するのか）」を加え、意図・注意・態度の3要素（IAAモデル）として整理しました。'],
  p: ['ビショップらの2要素＝注意の自己調整＋好奇心・開放性・受容の態度', '注意だけ、態度だけでは不十分', 'IAAモデル＝意図・注意・態度'] },
{ id: '1-3', u: 0, th: '理論', t: '土台となる7つの態度', g: '7つの態度を挙げ、それぞれの意味を説明できる', b: [
  'カバットジンは著書の中で、実践の土台として7つの態度を挙げています。',
  '①[[評価しない]]：判定している自分に気づく。②[[忍耐]]：物事にはそれぞれの時間があると認める。③[[初心（ビギナーズ・マインド）]]：初めて見るかのように体験する。④[[信頼]]：自分の感覚を信頼する。',
  '⑤[[がんばらない]]：特定の状態に到達しようとしない。⑥[[受容]]：今あるものを、まずあるがままに認める。⑦[[手放す]]：しがみつかず、押しのけもしない。',
  '受容は「あきらめ」や「賛成」ではありません。今の現実を正確に見ることで、次の行動を選べるようになる、という意味です。'],
  p: ['評価しない・忍耐・初心・信頼・がんばらない・受容・手放す', '受容はあきらめではなく、現実を正確に見ること', '態度は「身につける技術」として練習する'] },
{ id: '1-4', u: 0, th: '理論', t: '集中瞑想と観察瞑想', g: '2種類の瞑想スタイルの違いを説明できる', b: [
  '瞑想の方法は大きく2つに分けられます。1つは[[集中瞑想（フォーカスト・アテンション）]]。呼吸など1つの対象に注意を置き、それたら戻します。',
  'もう1つは[[観察瞑想（オープン・モニタリング）]]。対象を1つに決めず、音・感覚・思考など、その瞬間に現れるものを反応せずに観察します。',
  '仏教の用語では、集中で心を静める実践を[[サマタ（止）]]、ありのままを観察する実践を[[ヴィパッサナー（観）]]と呼び、おおまかに対応します。',
  '多くのプログラムは集中瞑想から始めます。注意がある程度安定してから観察瞑想に進むと取り組みやすいためです。'],
  p: ['集中瞑想＝1つの対象に注意を置いて戻す', '観察瞑想＝現れるものを選ばず観察する', 'サマタ（止）とヴィパッサナー（観）におおむね対応'] },
{ id: '1-5', u: 0, th: '理論', t: 'よくある誤解', g: '代表的な誤解を訂正できる', b: [
  '[[「無になること」ではありません。]]考えは浮かんで当たり前で、止める必要はありません。考えが浮かんだと気づけたら、その瞬間がマインドフルです。',
  '[[「リラックス法」でもありません。]]落ち着くことは結果として起こりますが、目的は気づくことです。緊張していれば「緊張がある」と気づくのが実践です。',
  '[[「ポジティブ思考」でもありません。]]不快な感覚や感情を良いものに書き換えるのではなく、そのまま観察します。',
  '「現実逃避」「感情を消す方法」「特定の宗教の実践」というのも誤解です。現代のプログラムは宗教色を除いた心のトレーニングとして作られています。また、万能薬でもありません（第4章）。'],
  p: ['無になる・リラックス・ポジティブ思考とは別のもの', '「それた」と気づくことは失敗ではなく成功', '万能薬ではない'] },

{ id: '2-1', u: 1, th: '歴史', t: 'ルーツ：仏教の「サティ」', g: 'サティと四念処を説明できる', b: [
  'マインドフルネスの語源は、パーリ語の[[サティ（sati）]]です。「気づき」「心にとどめておくこと」という意味で、漢訳は「念」。サンスクリット語ではスムリティといいます。',
  'サティは、ブッダが説いた苦しみを減らすための8つの実践の道[[八正道]]の7番目、[[正念]]にあたります。',
  '実践の具体的な方法は[[『念処経』（サティパッターナ・スッタ）]]にまとめられています。気づきを向ける4つの領域が[[四念処]]です。身（体と呼吸）、受（快・不快・どちらでもないという感じ）、心（心の状態）、法（心に現れる現象とその法則）。',
  '呼吸への気づきは[[出入息念（アーナーパーナサティ）]]と呼ばれ、現代の呼吸瞑想の原型になっています。'],
  p: ['サティ＝パーリ語で「気づき」、漢訳は「念」', '八正道の正念にあたる', '四念処＝身・受・心・法'] },
{ id: '2-2', u: 1, th: '歴史', t: '西洋への伝わり方', g: '19〜20世紀に瞑想が西洋へ広まった流れを説明できる', b: [
  '[[1881年]]、イギリスの仏教学者リス・デイヴィッズがサティの訳語として[[mindfulness]]を用いました。これが英語として定着していきます。',
  '20世紀前半、ミャンマーのマハーシ・サヤドーらが在家の人にも取り組める形でヴィパッサナー瞑想を広めました。日本からは鈴木大拙が禅を英語で紹介します。',
  '1960〜70年代、アメリカで東洋の瞑想への関心が高まります。[[1970年]]に鈴木俊隆『禅マインド ビギナーズ・マインド』、[[1975年]]にベトナムの禅僧ティク・ナット・ハン『マインドフルネスの奇跡』が出版されました。',
  '同じ1975年、アジアで修行したゴールドスタイン、コーンフィールド、サルツバーグらがマサチューセッツ州に[[インサイト・メディテーション・ソサエティ（IMS）]]を設立し、西洋人による指導の拠点ができました。'],
  p: ['1881年 リス・デイヴィッズがsatiをmindfulnessと訳す', '1970年代、禅とヴィパッサナーがアメリカに広まる', '1975年 IMS設立'] },
{ id: '2-3', u: 1, th: '歴史', t: 'MBSRの誕生（1979年）', g: 'MBSRの成り立ちと構成を説明できる', b: [
  '分子生物学の博士号を持ち、禅やヴィパッサナーを学んでいた[[ジョン・カバットジン]]は、[[1979年]]にマサチューセッツ大学医療センターで「ストレス低減クリニック」を始めました。',
  '対象は、慢性の痛みなど通常の治療だけでは苦しみが残る患者。瞑想を仏教の文脈から切り離し、誰でも参加できる医療の補助プログラムにしたのが[[MBSR（マインドフルネスストレス低減法）]]です。',
  '構成は[[8週間]]。週1回およそ2時間半のグループセッション、途中に1日の集中実践、そして毎日およそ45分の自宅練習。内容はボディスキャン、静坐瞑想、マインドフル・ヨーガなどです。',
  '1982年に慢性疼痛患者への最初の研究論文が出され、1990年の著書『Full Catastrophe Living』（邦訳『マインドフルネスストレス低減法』）で一般にも知られるようになりました。'],
  p: ['1979年、カバットジンがマサチューセッツ大学で開始', '8週間・週1回のグループ＋毎日の自宅練習', '宗教色を除いた医療の補助プログラム'] },
{ id: '2-4', u: 1, th: '歴史', t: '心理療法への統合', g: 'MBCT・DBT・ACTの特徴を区別できる', b: [
  '1990年代以降、マインドフルネスは心理療法に組み込まれ、行動療法・認知療法に続く[[「第3世代の認知行動療法」]]と呼ばれる流れを作りました。',
  '[[MBCT（マインドフルネス認知療法）]]：シーガル、ウィリアムズ、ティーズデールが開発。MBSRの構成に認知療法を組み合わせ、[[うつ病の再発予防]]を目的とします。2000年に臨床試験、2002年に治療マニュアルが発表され、2004年にはイギリスのNICEガイドラインが、うつ病を3回以上繰り返した人への選択肢として推奨しました。',
  '[[DBT（弁証法的行動療法）]]：マーシャ・リネハンが1993年に体系化。境界性パーソナリティ障害などを対象に、マインドフルネスを中核スキルの1つとします。',
  '[[ACT（アクセプタンス＆コミットメント・セラピー）]]：スティーブン・ヘイズらが1999年に体系化。思考と距離を取り、不快な体験を受け入れながら、自分の価値に沿って行動することを目指します。'],
  p: ['MBCT＝うつ病の再発予防（シーガルら）', 'DBT＝リネハン、ACT＝ヘイズ', 'まとめて「第3世代の認知行動療法」'] },
{ id: '2-5', u: 1, th: '歴史', t: '社会への広がりと批判', g: '2000年代以降の広がりと、それに対する批判を説明できる', b: [
  '[[2007年]]、グーグルで社内研修「サーチ・インサイド・ユアセルフ（SIY）」が始まり、企業への導入が進みます。学校教育、スポーツ、刑務所、軍などにも広がりました。',
  '[[2014年]]にはアメリカの『TIME』誌が「マインドフル革命」を表紙で特集。2015年にはイギリス議会の超党派グループが、医療・教育・職場・司法での活用を提言する報告書『Mindful Nation UK』を出しました。日本では2013年に日本マインドフルネス学会が設立されています。',
  '一方で批判もあります。倫理や社会への視点を切り落とし、個人のストレス対処や生産性向上の道具として商品化されているという[[「マクマインドフルネス」]]批判です。',
  '研究面でも、効果が実際以上に宣伝されているという指摘があります（第4章）。広がりと同時に、質と誠実さが問われる段階に入っています。'],
  p: ['2007年グーグルのSIY、2014年TIME誌の特集', '2013年 日本マインドフルネス学会設立', '商品化への「マクマインドフルネス」批判'] },

{ id: '3-1', u: 2, th: '心理', t: '自動操縦とさまよう心', g: 'マインドワンダリングとは何か、その影響を説明できる', b: [
  '通い慣れた道を歩いていて、気づいたら着いていた。これは[[自動操縦]]の状態です。習慣化された行動は便利ですが、その間、心は別のところにあります。',
  '今していることと関係のないことを考えている状態を[[マインドワンダリング（心のさまよい）]]といいます。',
  '2010年、キリングスワースとギルバートはスマートフォンで約2,250人の日常を調べ、[[人は起きている時間のおよそ47％、今していることとは別のことを考えている]]と報告しました。さらに、心がさまよっているときは、そうでないときより幸福度が低い傾向がありました。',
  'さまようこと自体は、計画や創造にも役立つ心の自然なはたらきです。問題は、気づかないまま不安や後悔のループに巻き込まれることです。'],
  p: ['自動操縦＝行動と心が別々の状態', '起きている時間の約47％は心がさまよっている（2010年の研究）', '問題は「気づかないまま」巻き込まれること'] },
{ id: '3-2', u: 2, th: '心理', t: '注意の4ステップ', g: '瞑想中に起きる注意のサイクルを説明できる', b: [
  '呼吸瞑想の最中に起きていることは、4つのステップの繰り返しです。①呼吸に[[集中する]]、②心が[[さまよう]]、③さまよっていたと[[気づく]]、④注意を呼吸に[[戻す]]。',
  '2012年、ハーゼンカンプらは瞑想中の脳を調べ、この4つの局面でそれぞれ違う脳のネットワークがはたらくことを示しました。',
  '大事なのは③です。[[「それた」と気づいた瞬間こそ、マインドフルネスが起きている瞬間]]です。筋トレでいえば、ダンベルを持ち上げる1回にあたります。',
  'だから、何度もそれることは失敗ではありません。10回それて10回戻れば、10回分の練習になります。戻すときに自分を責めないことも練習の一部です。'],
  p: ['集中→さまよう→気づく→戻す', '「気づく」瞬間が練習の核心', 'それる回数が多い＝練習の回数が多い'] },
{ id: '3-3', u: 2, th: '心理', t: '反すうと脱中心化', g: '反すうと脱中心化を説明できる', b: [
  '嫌な出来事や自分の欠点について、同じことをぐるぐる考え続けるのが[[反すう]]です。問題解決のように感じられますが、実際には気分の落ち込みを長引かせ、うつ病の再発とも関係します。未来についての繰り返しの考えは「心配」と呼ばれます。',
  'MBCTの理論では、気分が少し落ちたときに否定的な考えのパターンが自動的に動き出すことが、再発の引き金になると考えます。',
  'これに対する鍵が[[脱中心化]]。考えを「事実」や「自分そのもの」ではなく、[[心に浮かんでは消える出来事]]として見ることです。「私はダメだ」ではなく「『私はダメだ』という考えが浮かんでいる」と捉え直します。',
  '考えの中身を変えようとするのではなく、考えとの関係を変える。これが従来の認知療法との違いです。'],
  p: ['反すう＝同じ考えを繰り返し、落ち込みを長引かせる', '脱中心化＝考えを「心の出来事」として見る', '中身ではなく、考えとの関係を変える'] },
{ id: '3-4', u: 2, th: '心理', t: '「すること」と「あること」', g: '2つの心のモードの違いを説明できる', b: [
  '[[することモード（doing）]]は、今の状態と理想の状態を比べ、その差を埋めようとする心のはたらきです。仕事や家事など、外の世界の課題には非常に有効です。',
  'ところが、同じやり方を気分に向けると裏目に出ます。「なぜ私は落ち込んでいるのか」「本当はこうあるべきなのに」と差を見つめ続けることが、反すうを生みます。',
  '[[あることモード（being）]]は、何かを変えようとせず、今の体験をそのまま受け取る状態です。目標に向かうのではなく、今ここにとどまります。',
  'マインドフルネスの練習は、することモードをなくすことではありません。[[今どちらのモードにいるかに気づき、必要に応じて切り替えられる]]ようになることです。'],
  p: ['することモード＝差を埋めようとする（課題解決向き）', 'あることモード＝今の体験をそのまま受け取る', '気づいて切り替えられることが目標'] },
{ id: '3-5', u: 2, th: '心理', t: '二本の矢：痛みと苦しみ', g: '「第二の矢」のたとえと体験の回避を説明できる', b: [
  '仏典に[[二本の矢]]のたとえがあります。体の痛みや嫌な出来事という[[第一の矢]]は誰にでも刺さり、避けられません。',
  'それに対して「なぜ私だけ」「もうおしまいだ」と抵抗し、嘆き、考え続けることが[[第二の矢]]。こちらは自分で自分に刺している矢で、苦しみを何倍にもします。',
  '不快な感覚や感情を感じないように避けたり抑えたりすることを[[体験の回避]]といいます。短期的には楽になりますが、長期的には問題を大きくしやすいことが知られています。',
  'マインドフルネスが目指すのは、第一の矢をなくすことではなく、第二の矢に気づいて打つのを減らすこと。そのための態度が[[受容（アクセプタンス）]]です。'],
  p: ['第一の矢＝避けられない痛み、第二の矢＝反応が生む苦しみ', '体験の回避は長期的に問題を大きくしやすい', '受容で第二の矢を減らす'] },
{ id: '3-6', u: 2, th: '心理', t: '思考・感情・身体感覚のつながり', g: '体験を要素に分けて観察できる', b: [
  '強い感情に飲み込まれると、体験は1つの大きなかたまりに感じられます。マインドフルネスでは、それを[[思考・感情・身体感覚・行動への衝動]]に分けて観察します。',
  'たとえば、返信が来ない。思考「嫌われたかも」、感情は不安、身体は胸がざわつき肩に力が入る、衝動は何度もスマホを確認したくなる。この4つは互いに強め合います。',
  '要素に分けると、それぞれが[[変化し続ける一時的なもの]]だとわかり、巻き込まれにくくなります。特に身体感覚は「今ここ」にしかないので、注意の錨（いかり）として使えます。',
  '感情に名前をつける[[ラベリング]]も有効です。「不安がある」と言葉にすると、感情の渦の中から一歩外に出られます。'],
  p: ['体験を思考・感情・身体感覚・衝動に分ける', '4つは互いに強め合う', 'ラベリングで一歩外に出る'] },

{ id: '4-1', u: 3, th: '科学', t: 'デフォルト・モード・ネットワーク', g: 'DMNとマインドフルネスの関係を説明できる', b: [
  '何もしていないときにも、脳は活発にはたらいています。課題に取り組んでいないときに活動が高まる脳の領域のまとまりを[[デフォルト・モード・ネットワーク（DMN）]]といい、2001年にレイクルらが名づけました。',
  'DMNは、自分についての思考、過去の回想、未来の想像などに関わり、マインドワンダリングと関係が深いと考えられています。',
  '2011年、ブルワーらは、瞑想の経験が長い人では[[瞑想中にDMNの主要な部位の活動が低い]]ことを報告しました。',
  'ただしDMNは悪者ではありません。記憶の整理や計画、他者の気持ちの想像にも必要です。過剰にはたらき続けて反すうにつながることが問題だと考えられています。'],
  p: ['DMN＝何もしていないときに活動が高まる脳のネットワーク', '自己についての思考やマインドワンダリングと関係', '瞑想経験者では瞑想中の活動が低い（2011年）'] },
{ id: '4-2', u: 3, th: '科学', t: '脳は変わるのか', g: '脳構造の研究と、その再現性の問題を説明できる', b: [
  '経験によって脳が変化する性質を[[神経可塑性]]といいます。瞑想でも脳が変わるのではないか、という研究が2000年代に注目されました。',
  '2005年、ラザーらは瞑想経験者で注意や体の感覚に関わる[[大脳皮質が厚い]]と報告。2011年にはヘルツェルらが、8週間のMBSRのあとに記憶や感情に関わる[[海馬の灰白質の密度が増えた]]と報告し、広く引用されました。',
  'しかし、これらは参加者が少ない研究でした。2022年、クラルらはより大規模で厳密な試験を行い、[[8週間のMBSRで脳の構造の変化は確認できなかった]]と報告しています。',
  '「8週間で脳が変わる」という言い方は、現時点では言い過ぎです。脳のはたらき方（機能）の変化を示す研究はありますが、構造の変化については結論が出ていません。'],
  p: ['2005年ラザー、2011年ヘルツェルの研究が有名', '2022年の大規模試験では構造変化を再現できず', '「8週間で脳が変わる」は言い過ぎ'] },
{ id: '4-3', u: 3, th: '科学', t: '効果のエビデンス', g: '何に、どの程度の効果が示されているかを説明できる', b: [
  '複数の研究をまとめて分析する[[メタ分析]]が、効果を判断する材料になります。2014年、ゴヤルらは47の臨床試験（約3,500人）を分析し、マインドフルネス瞑想のプログラムが[[不安・抑うつ・痛みを改善する中程度のエビデンス]]があると報告しました。',
  '効果の大きさは小〜中程度。一方で、他の積極的な治療（運動、薬、他の心理療法など）より[[優れているという証拠はなかった]]ことも同じ論文で示されています。',
  'うつ病の再発予防では、2016年にカイケンらが9つの試験を統合し、MBCTを受けた人は受けなかった人より[[60週以内の再発リスクが低い]]と報告しました。',
  'まとめると「一定の効果はあるが、特別によく効く魔法ではない」。運動や他の療法と並ぶ、選択肢の1つという位置づけです。'],
  p: ['不安・抑うつ・痛みに中程度のエビデンス（2014年）', '他の治療より優れているとはいえない', 'MBCTはうつ病の再発リスクを下げる（2016年）'] },
{ id: '4-4', u: 3, th: '科学', t: '研究の限界と有害事象', g: '研究の弱点と、起こりうる不調を説明できる', b: [
  '2018年、ヴァン・ダムら15人の研究者は論文[[「Mind the Hype（誇大宣伝に注意）」]]で、マインドフルネス研究の問題点を指摘しました。',
  '主な問題は、①研究によって「マインドフルネス」の定義がばらばら、②測定が本人の回答（質問紙）に頼っている、③参加者が少ない研究や、適切な比較グループのない研究が多い、④有害事象がきちんと調べられていない、の4つです。',
  '瞑想で[[不安の高まり、つらい記憶のよみがえり、現実感がなくなる感じ]]などが起こることがあります。ブリトンらの研究では、こうした体験が一部の人で実際に起きており、長く続く例もあると報告されています。',
  '多くは一時的で軽いものですが、ゼロではありません。「誰にでも安全で、やればやるほど良い」とは言えない、というのが現在の理解です。'],
  p: ['2018年「Mind the Hype」が研究の弱点を指摘', '定義・測定・研究デザイン・有害事象の4つの問題', '瞑想で不調が起こることもある'] },
{ id: '4-5', u: 3, th: '科学', t: 'マインドフルネスを測る', g: '代表的な尺度と5つの側面を説明できる', b: [
  'マインドフルネスは主に質問紙で測定します。代表的なものが2003年の[[MAAS]]で、「気づかないうちに物事をしている」などの項目から、日常での注意深さを測ります。',
  '2006年にベアらが作った[[FFMQ（5因子マインドフルネス質問紙）]]は、5つの側面に分けて測ります。①[[観察]]（感覚や感情に気づく）、②[[描写]]（体験を言葉にする）、③[[意識した行動]]（自動操縦でなく行動する）、④[[判断しない]]（体験を評価しない）、⑤[[反応しない]]（思考や感情に巻き込まれない）。',
  'この5側面は、自分の得意・不得意を知る手がかりになります。たとえば「観察」は得意でも「判断しない」が苦手、という人は少なくありません。',
  'ただし質問紙には限界があります。自分の不注意に気づける人ほど点数が低く出る、という逆説も指摘されています。',

function hbars(pairs) { var mx = Math.max.apply(null, pairs.map(function (p) { return p[1]; }).concat([1])); return pairs.map(function (p) { return '<div class="hb"><span>' + esc(p[0]) + '</span><div><i style="width:' + (p[1] / mx * 100) + '%"></i></div><em>' + p[1] + '</em></div>'; }).join(''); }

function makeChoice(g, pool, reverse) {
  var same = pool.filter(function (x) { return x[0] !== g[0] && x[2] === g[2]; }), other = GLOSS.filter(function (x) { return x[0] !== g[0] && x[2] !== g[2]; });
  var wrong = shuffle(same).slice(0, 3); if (wrong.length < 3) wrong = wrong.concat(shuffle(GLOSS.filter(function (x) { return x[0] !== g[0] && wrong.indexOf(x) < 0 && x[2] === g[2]; })).slice(0, 3 - wrong.length));
  if (wrong.length < 3) wrong = wrong.concat(shuffle(other).slice(0, 3 - wrong.length));
  var opts = shuffle([g].concat(wrong)), k = reverse ? 3 : 0;
  return { q: reverse ? '「' + g[0] + '」の説明として正しいものは？' : g[3], o: opts.map(function (x) { return x[k]; }), a: opts.indexOf(g), ex: g[0] + '：' + g[3], term: g[0] };
}
function startQuiz(title, qs, flip, backTo) { if (!qs.length) return; quiz = { title: title, qs: qs, i: 0, score: 0, flip: flip, back: backTo, shown: false, picked: -1 }; go('quiz'); }
V.quiz = function () {
  if (!quiz) return V.qa();
  var z = quiz, h = top(z.title);
  if (z.i >= z.qs.length) {
    var r = Math.round(z.score / z.qs.length * 100);
    return h + '<div class="box center"><p class="note">結果</p><div class="big">' + z.score + ' / ' + z.qs.length + '</div><p class="note">' + (r === 100 ? '全問正解です。' : r >= 70 ? 'よくできました。まちがえた用語は「復習」に入っています。' : '講義と用語集を見直してから、もう一度挑戦しましょう。') + '</p></div>' +
      '<div class="row"><button class="btn plain" data-back>戻る</button><button class="btn" data-go="review">復習を見る</button></div>';
  }
  var q = z.qs[z.i];
  h += '<div class="qhead"><span>' + (z.i + 1) + ' / ' + z.qs.length + '</span><span>正解 ' + z.score + '</span></div><div class="bar"><i style="width:' + (z.i / z.qs.length * 100) + '%"></i></div><div class="qtext">' + esc(q.q) + '</div>';
  if (z.flip) {
    h += z.shown ? '<div class="ans"><b>' + esc(q.term) + '</b></div><div class="row"><button class="btn plain" data-flip="0">まだ</button><button class="btn" data-flip="1">覚えた</button></div>' : '<button class="btn" data-reveal>答えを見る</button>';
  } else {
    h += q.o.map(function (o, i) { var c = z.picked < 0 ? '' : i === q.a ? ' right' : i === z.picked ? ' wrong' : ''; return '<button class="opt' + c + '" data-pick="' + i + '"' + (z.picked >= 0 ? ' disabled' : '') + '>' + esc(o) + '</button>'; }).join('');
    if (z.picked >= 0) h += '<div class="ans">' + (z.picked === q.a ? '○ 正解。' : '× 不正解。') + esc(q.ex) + '</div><button class="btn" data-nextq>' + (z.i === z.qs.length - 1 ? '結果を見る' : '次へ') + '</button>';
  }
  return h;
};
function grade(q, ok) { if (ok) { quiz.score++; if (q.term) { S.known[q.term] = 1; delete S.weak[q.term]; } } else if (q.term) { S.weak[q.term] = 1; delete S.known[q.term]; } save(); }

/* ================= 実践タイマー ================= */
var sit = { p: null, min: 3, left: 0, tick: null, ph: null, on: false, n: 0 };
var AC = null;
function bell() {
  if (!S.opt.bell) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    var t = AC.currentTime;
    [[528, .5], [1056, .18], [1590, .08]].forEach(function (f) {
      var o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(f[1], t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 3.6);
    });
  } catch (e) {}
}
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function say(text) {
  if (!S.opt.voice || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text.replace(/[「」]/g, '')); u.lang = 'ja-JP'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
}
function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function phase(isIn) { var c = document.getElementById('circle'); if (!c || !sit.on) return; c.className = 'circle ' + (isIn ? 'in' : 'out'); c.textContent = isIn ? '吸う' : '吐く'; sit.ph = setTimeout(function () { phase(!isIn); }, isIn ? 4000 : 6000); }
function sitStop(finished) {
  var was = sit.on; sit.on = false; clearInterval(sit.tick); clearTimeout(sit.ph);
  var c = document.getElementById('circle'); if (!c) return;
  c.className = 'circle out'; c.textContent = finished ? 'おつかれさま' : 'はじめる';
  document.getElementById('sit-btn').textContent = finished ? 'もう一度' : 'スタート';
  document.getElementById('left').textContent = fmt(sit.min * 60);
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  if (finished && was) { bell(); S.log.push({ d: today(), t: sit.p.t, m: sit.min, n: sit.n }); if (S.log.length > 400) S.log.shift(); save(); document.getElementById('guide').textContent = sit.min + '分の実践を記録しました。' + (sit.n ? '気づいて戻った回数は' + sit.n + '回。' + sit.n + '回分の練習です。' : '今の体と心の状態を、ひとこと確かめてみましょう。'); }
  else document.getElementById('guide').textContent = sit.p.s;
}
function sitStart() {
  var total = sit.min * 60, g = sit.p.g; sit.on = true; sit.left = total; sit.n = 0; bell(); document.getElementById('reps').textContent = '';
  document.getElementById('sit-btn').textContent = 'やめる';
  var c = document.getElementById('circle'); if (sit.p.pace) phase(true); else c.textContent = sit.p.t;
  function guide() { var i = Math.min(g.length - 1, Math.floor((total - sit.left) / (total / g.length))); var el = document.getElementById('guide'); if (el && el.textContent !== g[i]) { el.textContent = g[i]; say(g[i]); } }
  guide();
  sit.tick = setInterval(function () { sit.left--; var el = document.getElementById('left'); if (!el) { sitStop(false); return; } el.textContent = fmt(Math.max(sit.left, 0)); if (sit.left <= 0) sitStop(true); else guide(); }, 1000);
}

/* ================= ルーター ================= */
function go(route) { if (location.hash === '#/' + route) render(); else location.hash = '#/' + route; }
function render() {
  if (sit.on) { sit.on = false; clearInterval(sit.tick); clearTimeout(sit.ph); try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
  labStop();
  var parts = location.hash.replace(/^#\/?/, '').split('/'), name = parts[0] || 'home';
  if (!V[name]) name = 'home';
  app.innerHTML = '<div class="view">' + V[name](parts[1]) + '</div>';
  var tab = name === 'review' ? 'review' : name === 'search' ? 'search' : 'home';
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.go === tab); });
  if (render.last !== location.hash) window.scrollTo(0, 0);
  render.last = location.hash;
}
window.addEventListener('hashchange', render);

document.addEventListener('click', function (e) {
  var t = e.target.closest('button, input[type=checkbox]'); if (!t) return;
  var d = t.dataset;
  if (d.go !== undefined) return go(d.go);
  if (d.opt) { S.opt[d.opt] = S.opt[d.opt] ? 0 : 1; save(); t.classList.toggle('on', !!S.opt[d.opt]); if (S.opt[d.opt]) { if (d.opt === 'bell') bell(); else say('音声ガイドをオンにしました'); } return; }
  if (d.rep !== undefined) { if (sit.on) { sit.n++; vib(20); $('reps').textContent = '気づき ' + sit.n + '回'; } return; }
  if (d.exmin) { ui.exmin = +d.exmin; document.querySelectorAll('[data-exmin]').forEach(function (b) { b.classList.toggle('on', b === t); }); return; }
  if (d.exstart) return startExp(d.exstart);
  if (d.bc) { if (d.bc === 'b') X.n++; else if (d.bc === '9') { if (X.n === 8) X.ok++; else X.ng++; X.n = 0; } else { X.rs++; X.n = 0; } vib(15); return; }
  if (d.pr) { X.c[d.pr]++; clearTimeout(X.wait); X.idle(); X.sched(); return; }
  if (d.sa !== undefined) { if (X.cur && !X.cur.hit) { X.cur.hit = true; X.cur.rt = Date.now() - X.cur.t; } return; }
  if (d.lb) { X.c[d.lb] = (X.c[d.lb] || 0) + 1; t.querySelector('small').textContent = X.c[d.lb]; vib(15); return; }
  if (d.fq) { ui.fa[+d.fq] = +d.fv; t.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === t); }); return; }
  if (d.fsubmit !== undefined) {
    var miss = FQ.map(function (q, i) { return ui.fa[i] ? 0 : i + 1; }).filter(Boolean);
    if (miss.length) { $('fmsg').textContent = '未回答：' + miss.join('、') + '問目'; return; }
    var sc = [0, 0, 0, 0, 0]; FQ.forEach(function (q, i) { sc[q[0]] += (q[2] ? 6 - ui.fa[i] : ui.fa[i]) / 3; });
    $('intro').style.display = 'none'; return finishExp('facet', { s: sc });
  }
  if (d.prog) { if (t.checked) S.prog[d.prog] = 1; else delete S.prog[d.prog]; save(); return; }
  if (d.back !== undefined) { if (history.length > 1 && render.last) history.back(); else go('home'); return; }
  if (d.set) { ui[d.set] = d.set === 'qn' ? +d.val : d.val; return render(); }
  if (d.theme) { ui.theme = d.theme; return render(); }
  if (d.era) { ui.era = d.era; return render(); }
  if (d.qcat) { ui.qcat = d.qcat; return render(); }
  if (d.gcat) { ui.gcat = d.gcat; return render(); }
  if (d.done) { if (S.done[d.done]) delete S.done[d.done]; else S.done[d.done] = 1; save(); return render(); }
  if (d.mark) { if (S.mark[d.mark]) delete S.mark[d.mark]; else S.mark[d.mark] = 1; save(); return render(); }
  if (d.term) { var g = glossByTerm(d.term); document.getElementById('term-pop').innerHTML = '<div class="ans"><b style="font-size:16px">' + esc(g[0]) + '</b>' + esc(g[3]) + '</div>'; return; }
  if (d.node !== undefined) return t.classList.toggle('on');
  if (d.ev !== undefined) return t.classList.toggle('on');
  if (d.lq) {
    var l = lessonById(d.lq), text = l.b.join(''), rel = GLOSS.filter(function (x) { return x[0].length > 1 && text.indexOf(x[0]) >= 0; });
    var cat = { '理論': '基礎', '歴史': '歴史', '心理': '心理', '科学': '科学', '実践': '実践', '日常': '応用' }[l.th];
    rel = shuffle(rel).concat(shuffle(GLOSS.filter(function (x) { return x[2] === cat && rel.indexOf(x) < 0; })));
    return startQuiz('確認問題 ' + l.id, rel.slice(0, 5).map(function (x) { return makeChoice(x, GLOSS, false); }), false, 'lesson/' + l.id);
  }
  if (d.startqa !== undefined) {
    var pool = GLOSS.filter(function (x) { return ui.qcat === 'すべて' || x[2] === ui.qcat; });
    var pick = shuffle(pool).sort(function (a, b) { return (S.known[a[0]] ? 1 : 0) - (S.known[b[0]] ? 1 : 0); }).slice(0, ui.qn);
    var flip = ui.qmode === 'めくる';
    return startQuiz('一問一答', shuffle(pick).map(function (x) { return flip ? { q: x[3], term: x[0] } : makeChoice(x, pool, ui.qmode === '逆引き'); }), flip, 'qa');
  }
  if (d.weakquiz !== undefined) return startQuiz('苦手な用語', shuffle(Object.keys(S.weak).map(glossByTerm).filter(Boolean)).map(function (x) { return makeChoice(x, GLOSS, false); }), false, 'review');
  if (d.yearquiz !== undefined) {
    var evs = TIMELINE.filter(function (x) { return x[5]; }), years = evs.map(function (x) { return x[0]; }).filter(function (y, i, a) { return a.indexOf(y) === i; });
    return startQuiz('年代クイズ', shuffle(evs).slice(0, 10).map(function (x) {
      var near = years.filter(function (y) { return y !== x[0]; }).sort(function (a, b) { return Math.abs(parseInt(a) - x[1]) - Math.abs(parseInt(b) - x[1]); }).slice(0, 5);
      var o = shuffle([x[0]].concat(shuffle(near).slice(0, 3)));
      return { q: x[3] + '　これは何年？', o: o, a: o.indexOf(x[0]), ex: x[0] + '。' + x[4] };
    }), false, 'timeline');
  }
  if (d.reveal !== undefined) { quiz.shown = true; return render(); }
  if (d.flip) { grade(quiz.qs[quiz.i], d.flip === '1'); quiz.i++; quiz.shown = false; return render(); }
  if (d.pick) { quiz.picked = +d.pick; grade(quiz.qs[quiz.i], quiz.picked === quiz.qs[quiz.i].a); return render(); }
  if (d.nextq !== undefined) { quiz.i++; quiz.picked = -1; return render(); }
  if (d.essayShow) { var i = d.essayShow, s = S.essay[i] || { c: [] }; s.t = document.getElementById('essay-in').value; s.open = 1; S.essay[i] = s; save(); document.getElementById('essay-ans').style.display = ''; document.getElementById('essay-ans').scrollIntoView({ behavior: 'smooth' }); return; }
  if (d.essayChk) { var s2 = S.essay[d.essayChk] || { t: '', c: [], open: 1 }; s2.c[+d.j] = t.checked; S.essay[d.essayChk] = s2; save(); return; }
  if (d.min) { if (sit.on) sitStop(false); sit.min = +d.min; document.querySelectorAll('[data-min]').forEach(function (b) { b.classList.toggle('on', b === t); }); document.getElementById('left').textContent = fmt(sit.min * 60); return; }
  if (d.sit !== undefined) { if (sit.on) sitStop(false); else sitStart(); return; }
  if (d.reset !== undefined) { if (confirm('学習の記録（講義、用語、記述演習、実践、実験室、プログラム）をすべて消します。元に戻せません。よろしいですか？')) { S = blank(); save(); render(); } return; }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { ui.q = e.target.value; document.getElementById('results').innerHTML = searchResults(); }
  if (e.target.id === 'essay-in') document.getElementById('cnt').textContent = e.target.value.length;
});
render();
})();
</script>
