<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="プログラミング未経験でも、ボタン操作でGitHubのしくみを体験しながら学べる練習アプリです。">
  <title>さわって覚えるGitHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 画面の中身は js/app.js が描画します -->
  <main id="app" class="app" tabindex="-1">
    <noscript>
      <p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>Claude Code講座 練習用アプリ ／ 本物のGitHubには接続しません。安心して何度でも試せます。</p>
  </footer>

  <!-- 読み込む順番が大事：共通部分 → 各ステージ -->
  <script src="js/app.js"></script>
  <script src="js/stages/stage1-repository.js"></script>
  <script src="js/stages/stage2-commit.js"></script>
</body>
</html>
